name: Build Android APK
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Auto Fix & Build
        run: |
          [ -d "AndroidFpsMonitor" ] && cp -r AndroidFpsMonitor/. .
          # 修复资源与图标
          sed -i 's/@mipmap\/ic_launcher/@drawable\/ic_fps/g' app/src/main/AndroidManifest.xml 2>/dev/null || true
          sed -i '/android:roundIcon/d' app/src/main/AndroidManifest.xml 2>/dev/null || true
          
          # 写入标准顶层构建配置
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.3.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF
          
          gradle wrapper --gradle-version 8.4
          ./gradlew assembleDebug --stacktrace --info -x test -x lint
      - uses: actions/upload-artifact@v4
        with:
          name: AndroidFpsMonitor-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
