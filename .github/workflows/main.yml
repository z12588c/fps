name: Build Android APK
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build Real-Time Racing HUD FPS APK
        run: |
          [ -d "AndroidFpsMonitor" ] && cp -r AndroidFpsMonitor/. .
          
          # 1. 注入 AndroidX 配置
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 2. 清洗 Manifest
          cat << 'MANIFEST_EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS"
                  tools:ignore="ProtectedPermissions" />

              <application
                  android:allowBackup="true"
                  android:dataExtractionRules="@xml/data_extraction_rules"
                  android:fullBackupContent="@xml/backup_rules"
                  android:icon="@drawable/ic_fps"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AndroidFpsMonitor">

                  <activity
                      android:name=".ui.MainActivity"
                      android:exported="true"
                      android:theme="@style/Theme.AndroidFpsMonitor">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".service.FloatingFpsService"
                      android:enabled="true"
                      android:exported="false" />

                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:multiprocess="false"
                      android:enabled="true"
                      android:exported="true"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL"
                      tools:replace="android:authorities" />

              </application>

          </manifest>
          MANIFEST_EOF

          # 3. 跑车仪表盘 View
          cat << 'CAR_VIEW_EOF' > app/src/main/java/com/fpsmonitor/app/ui/CarSpeedometerView.kt
          package com.fpsmonitor.app.ui

          import android.content.Context
          import android.graphics.*
          import android.util.AttributeSet
          import android.view.View
          import kotlin.math.cos
          import kotlin.math.sin

          class CarSpeedometerView @JvmOverloads constructor(
              context: Context,
              attrs: AttributeSet? = null,
              defStyleAttr: Int = 0
          ) : View(context, attrs, defStyleAttr) {

              private var currentFps = 120f
              private var maxFps = 144f

              private val bgArcPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeWidth = 14f
                  strokeCap = Paint.Cap.ROUND
                  color = Color.parseColor("#1E293B")
              }

              private val sweepArcPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeWidth = 14f
                  strokeCap = Paint.Cap.ROUND
              }

              private val tickPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeWidth = 2.5f
                  color = Color.parseColor("#475569")
              }

              private val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  textAlign = Paint.Align.CENTER
                  typeface = Typeface.DEFAULT_BOLD
              }

              private val arcRect = RectF()

              fun setFps(fps: Float) {
                  this.currentFps = fps.coerceIn(0f, 160f)
                  postInvalidateOnAnimation()
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val w = width.toFloat()
                  val h = height.toFloat()
                  if (w <= 0 || h <= 0) return

                  val cx = w / 2f
                  val cy = h * 0.58f
                  val radius = (w.coerceAtMost(h) / 2f) - 16f

                  arcRect.set(cx - radius, cy - radius, cx + radius, cy + radius)

                  val startAngle = 140f
                  val sweepTotalAngle = 260f

                  // 1. 底层暗色表盘圆弧
                  canvas.drawArc(arcRect, startAngle, sweepTotalAngle, false, bgArcPaint)

                  // 2. 表盘刻度线 (赛车转速表刻度)
                  val totalTicks = 24
                  for (i in 0..totalTicks) {
                      val angleDeg = startAngle + (i.toFloat() / totalTicks) * sweepTotalAngle
                      val rad = Math.toRadians(angleDeg.toDouble())

                      val isMajor = i % 4 == 0
                      val tickLen = if (isMajor) 14f else 8f
                      tickPaint.strokeWidth = if (isMajor) 3.5f else 1.8f
                      tickPaint.color = when {
                          i > 20 -> Color.parseColor("#FF1744")
                          isMajor -> Color.parseColor("#94A3B8")
                          else -> Color.parseColor("#334155")
                      }

                      val outerX = cx + (radius - 10f) * cos(rad).toFloat()
                      val outerY = cy + (radius - 10f) * sin(rad).toFloat()
                      val innerX = cx + (radius - 10f - tickLen) * cos(rad).toFloat()
                      val innerY = cy + (radius - 10f - tickLen) * sin(rad).toFloat()

                      canvas.drawLine(innerX, innerY, outerX, outerY, tickPaint)
                  }

                  // 3. 动态流光渐变彩色速度弧
                  val progressRatio = (currentFps / maxFps).coerceIn(0f, 1f)
                  val activeSweep = progressRatio * sweepTotalAngle

                  if (activeSweep > 0f) {
                      val sweepColors = intArrayOf(
                          Color.parseColor("#00E676"),
                          Color.parseColor("#38BDF8"),
                          Color.parseColor("#FFD600"),
                          Color.parseColor("#FF1744")
                      )
                      sweepArcPaint.shader = SweepGradient(
                          cx, cy,
                          sweepColors,
                          floatArrayOf(0f, 0.45f, 0.8f, 1f)
                      ).apply {
                          val matrix = Matrix()
                          matrix.postRotate(startAngle, cx, cy)
                          setLocalMatrix(matrix)
                      }
                      canvas.drawArc(arcRect, startAngle, activeSweep, false, sweepArcPaint)
                  }

                  // 4. 中央大字: FPS
                  val fpsColor = when {
                      currentFps >= 55f -> Color.parseColor("#00E676")
                      currentFps >= 40f -> Color.parseColor("#FFD600")
                      else -> Color.parseColor("#FF1744")
                  }

                  textPaint.color = Color.parseColor("#FFFFFF")
                  textPaint.textSize = radius * 0.48f
                  canvas.drawText(String.format("%.0f", currentFps), cx, cy + (radius * 0.08f), textPaint)

                  textPaint.color = fpsColor
                  textPaint.textSize = radius * 0.18f
                  canvas.drawText("FPS METER", cx, cy + (radius * 0.28f), textPaint)
              }
          }
          CAR_VIEW_EOF

          # 4. 毫秒级极速连续波形 View
          cat << 'WAVE_VIEW_EOF' > app/src/main/java/com/fpsmonitor/app/ui/FpsWaveformView.kt
          package com.fpsmonitor.app.ui

          import android.content.Context
          import android.graphics.*
          import android.util.AttributeSet
          import android.view.View

          class FpsWaveformView @JvmOverloads constructor(
              context: Context,
              attrs: AttributeSet? = null,
              defStyleAttr: Int = 0
          ) : View(context, attrs, defStyleAttr) {

              private val maxPoints = 70
              private val dataPoints = ArrayList<Float>(maxPoints)

              private val linePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeWidth = 3f
                  strokeCap = Paint.Cap.ROUND
                  strokeJoin = Paint.Join.ROUND
                  color = Color.parseColor("#00E676")
              }

              private val fillPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.FILL
              }

              private val gridPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeWidth = 1.2f
                  color = Color.parseColor("#20FFFFFF")
                  pathEffect = DashPathEffect(floatArrayOf(6f, 6f), 0f)
              }

              private val path = Path()
              private val fillPath = Path()

              init {
                  for (i in 0 until maxPoints) {
                      dataPoints.add(120f)
                  }
              }

              fun addFpsPoint(fps: Float) {
                  synchronized(dataPoints) {
                      if (dataPoints.size >= maxPoints) {
                          dataPoints.removeAt(0)
                      }
                      dataPoints.add(fps.coerceIn(0f, 150f))
                  }
                  postInvalidateOnAnimation()
              }

              fun updateData(list: List<Float>) {
                  synchronized(dataPoints) {
                      dataPoints.clear()
                      for (v in list.takeLast(maxPoints)) {
                          dataPoints.add(v)
                      }
                      while (dataPoints.size < maxPoints) {
                          dataPoints.add(0, 120f)
                      }
                  }
                  postInvalidateOnAnimation()
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val w = width.toFloat()
                  val h = height.toFloat()
                  if (w <= 0 || h <= 0) return

                  // 绘制 60 与 120 参考线
                  val y60 = h * (1f - 60f / 144f)
                  val y120 = h * (1f - 120f / 144f)
                  canvas.drawLine(0f, y60, w, y60, gridPaint)
                  canvas.drawLine(0f, y120, w, y120, gridPaint)

                  path.reset()
                  fillPath.reset()

                  val points: List<Float>
                  synchronized(dataPoints) {
                      points = ArrayList(dataPoints)
                  }
                  if (points.size < 2) return

                  val stepX = w / (maxPoints - 1).toFloat()
                  var latestFps = 120f

                  for (i in points.indices) {
                      val fps = points[i]
                      val x = i * stepX
                      val y = (h - (fps / 144f * (h - 8f))).coerceIn(4f, h - 4f)

                      if (i == 0) {
                          path.moveTo(x, y)
                          fillPath.moveTo(x, h)
                          fillPath.lineTo(x, y)
                      } else {
                          val prevFps = points[i - 1]
                          val prevX = (i - 1) * stepX
                          val prevY = (h - (prevFps / 144f * (h - 8f))).coerceIn(4f, h - 4f)
                          val cX = (prevX + x) / 2f
                          path.cubicTo(cX, prevY, cX, y, x, y)
                          fillPath.cubicTo(cX, prevY, cX, y, x, y)
                      }

                      if (i == points.size - 1) {
                          latestFps = fps
                          fillPath.lineTo(x, h)
                          fillPath.close()
                      }
                  }

                  val mainColor = when {
                      latestFps >= 55f -> Color.parseColor("#00E676")
                      latestFps >= 40f -> Color.parseColor("#FFD600")
                      else -> Color.parseColor("#FF1744")
                  }
                  linePaint.color = mainColor

                  fillPaint.shader = LinearGradient(
                      0f, 0f, 0f, h,
                      mainColor and 0x45FFFFFF,
                      Color.TRANSPARENT,
                      Shader.TileMode.CLAMP
                  )

                  canvas.drawPath(fillPath, fillPaint)
                  canvas.drawPath(path, linePaint)
              }
          }
          WAVE_VIEW_EOF

          # 5. 汽车仪表盘风格 UI 布局
          cat << 'LAYOUT_EOF' > app/src/main/res/layout/view_floating_fps.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="wrap_content"
              android:layout_height="wrap_content">

              <!-- 极简迷你仪表胶囊 -->
              <LinearLayout
                  android:id="@+id/container_mini"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:background="@drawable/bg_floating_mini"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  android:paddingStart="12dp"
                  android:paddingEnd="12dp"
                  android:paddingTop="6dp"
                  android:paddingBottom="6dp"
                  android:visibility="visible">

                  <!-- FPS 徽章 -->
                  <LinearLayout
                      android:id="@+id/badge_mini_fps"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">
                      <TextView
                          android:id="@+id/tv_mini_fps"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="120 FPS"
                          android:textColor="#00E676"
                          android:textSize="13sp"
                          android:textStyle="bold" />
                  </LinearLayout>

                  <!-- CPU 徽章 -->
                  <LinearLayout
                      android:id="@+id/badge_mini_cpu"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">
                      <View
                          android:layout_width="1dp"
                          android:layout_height="10dp"
                          android:layout_marginStart="6dp"
                          android:layout_marginEnd="6dp"
                          android:background="#40FFFFFF" />
                      <TextView
                          android:id="@+id/tv_mini_cpu"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="CPU 25%"
                          android:textColor="#C084FC"
                          android:textSize="12sp"
                          android:textStyle="bold" />
                  </LinearLayout>

                  <!-- RAM 徽章 -->
                  <LinearLayout
                      android:id="@+id/badge_mini_ram"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">
                      <View
                          android:layout_width="1dp"
                          android:layout_height="10dp"
                          android:layout_marginStart="6dp"
                          android:layout_marginEnd="6dp"
                          android:background="#40FFFFFF" />
                      <TextView
                          android:id="@+id/tv_mini_ram"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="RAM 58%"
                          android:textColor="#38BDF8"
                          android:textSize="12sp"
                          android:textStyle="bold" />
                  </LinearLayout>

                  <!-- 温度徽章 -->
                  <LinearLayout
                      android:id="@+id/badge_mini_temp"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">
                      <View
                          android:layout_width="1dp"
                          android:layout_height="10dp"
                          android:layout_marginStart="6dp"
                          android:layout_marginEnd="6dp"
                          android:background="#40FFFFFF" />
                      <TextView
                          android:id="@+id/tv_mini_temp"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="35.5°C"
                          android:textColor="#FBBF24"
                          android:textSize="12sp"
                          android:textStyle="bold" />
                  </LinearLayout>

              </LinearLayout>

              <!-- 跑车仪表盘展开 HUD 卡片 -->
              <LinearLayout
                  android:id="@+id/container_expanded"
                  android:layout_width="260dp"
                  android:layout_height="wrap_content"
                  android:background="@drawable/bg_floating_card"
                  android:orientation="vertical"
                  android:padding="12dp"
                  android:visibility="gone">

                  <!-- 顶部标题与关闭 -->
                  <RelativeLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="RACING HUD METER"
                          android:textColor="#94A3B8"
                          android:textSize="11sp"
                          android:textStyle="bold" />

                      <ImageButton
                          android:id="@+id/btn_close_floating"
                          android:layout_width="26dp"
                          android:layout_height="26dp"
                          android:layout_alignParentEnd="true"
                          android:background="@android:color/transparent"
                          android:src="@drawable/ic_close"
                          android:contentDescription="Close" />
                  </RelativeLayout>

                  <!-- 跑车圆形转速表/速度表表盘 -->
                  <LinearLayout
                      android:id="@+id/section_car_gauge"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:gravity="center_horizontal"
                      android:orientation="vertical">

                      <com.fpsmonitor.app.ui.CarSpeedometerView
                          android:id="@+id/car_speedometer_view"
                          android:layout_width="160dp"
                          android:layout_height="115dp" />

                      <TextView
                          android:id="@+id/tv_fps_sub"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="-2dp"
                          android:text="Avg: 119.8 | 1% Low: 114.0"
                          android:textColor="#94A3B8"
                          android:textSize="10sp" />
                  </LinearLayout>

                  <!-- CPU / RAM / 温度 三联副仪表盘 -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:orientation="horizontal"
                      android:weightSum="3">

                      <!-- CPU 槽 -->
                      <LinearLayout
                          android:id="@+id/section_cpu_gauge"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:layout_marginEnd="3dp"
                          android:background="#15FFFFFF"
                          android:padding="5dp"
                          android:orientation="vertical">
                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="CPU"
                              android:textColor="#94A3B8"
                              android:textSize="9sp" />
                          <TextView
                              android:id="@+id/tv_gauge_cpu"
