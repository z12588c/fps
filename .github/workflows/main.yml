          package com.fpsmonitor.app.service

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import android.os.IBinder
          import androidx.core.app.NotificationCompat
          import com.fpsmonitor.app.R
          import com.fpsmonitor.app.core.*
          import com.fpsmonitor.app.ui.FloatingFpsView
          import com.fpsmonitor.app.ui.MainActivity
          import com.fpsmonitor.app.util.ShellUtils
          import com.fpsmonitor.app.util.ShizukuUtils

          class FloatingFpsService : Service() {

              companion object {
                  const val ACTION_START = "ACTION_START"
                  const val ACTION_STOP = "ACTION_STOP"
                  const val EXTRA_MODE = "EXTRA_MODE"

                  fun startService(context: Context, mode: String = "SURFACE_FLINGER", useRoot: Boolean = false, useShizuku: Boolean = false) {
                      val intent = Intent(context, FloatingFpsService::class.java).apply {
                          action = ACTION_START
                          putExtra(EXTRA_MODE, mode)
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          context.startForegroundService(intent)
                      } else {
                          context.startService(intent)
                      }
                  }

                  fun stopService(context: Context) {
                      val intent = Intent(context, FloatingFpsService::class.java).apply {
                          action = ACTION_STOP
                      }
                      context.startService(intent)
                  }
              }

              private var floatingView: FloatingFpsView? = null
              private var monitor: IFpsMonitor? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  createNotificationChannel()
                  startForeground(1001, buildNotification())
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP) {
                      stopFloatingMonitor()
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  val mode = intent?.getStringExtra(EXTRA_MODE) ?: "SURFACE_FLINGER"
                  startFloatingMonitor(mode)
                  return START_STICKY
              }

              private fun startFloatingMonitor(mode: String) {
                  stopFloatingMonitor()
                  floatingView = FloatingFpsView(applicationContext) {
                      stopFloatingMonitor()
                      stopSelf()
                  }
                  floatingView?.attachToWindow()

                  monitor = SurfaceFlingerMonitor(
                      useRoot = ShellUtils.isRootAvailable(),
                      useShizuku = ShizukuUtils.hasShizukuPermission() || ShizukuUtils.isShizukuAvailable()
                  )
                  monitor?.start { data -> floatingView?.updateMetrics(data) }
              }

              private fun stopFloatingMonitor() {
                  monitor?.stop()
                  monitor = null
                  floatingView?.detachFromWindow()
                  floatingView = null
                  try { stopForeground(STOP_FOREGROUND_REMOVE) } catch (_: Throwable) {}
              }

              override fun onDestroy() {
                  super.onDestroy()
                  stopFloatingMonitor()
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel("fps_monitor_channel", "FPS Monitor Service", NotificationManager.IMPORTANCE_LOW).apply {
                          description = "Running real-time FPS overlay"
                          setShowBadge(false)
                      }
                      getSystemService(NotificationManager::class.java)?.createNotificationChannel(channel)
                  }
              }

              private fun buildNotification(): Notification {
                  val pendingIntent = PendingIntent.getActivity(this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                  return NotificationCompat.Builder(this, "fps_monitor_channel")
                      .setContentTitle("Android FPS Monitor")
                      .setContentText("FPS 实时悬浮窗运行中...")
                      .setSmallIcon(R.drawable.ic_fps)
                      .setContentIntent(pendingIntent)
                      .setOngoing(true)
                      .build()
              }
          }
          SERVICE_EOF

          # 11. MainActivity
          cat << 'MAIN_EOF' > app/src/main/java/com/fpsmonitor/app/ui/MainActivity.kt
          package com.fpsmonitor.app.ui

          import android.Manifest
          import android.animation.ValueAnimator
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.view.animation.LinearInterpolator
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import com.fpsmonitor.app.R
          import com.fpsmonitor.app.core.ChoreographerMonitor
          import com.fpsmonitor.app.core.FpsData
          import com.fpsmonitor.app.databinding.ActivityMainBinding
          import com.fpsmonitor.app.service.FloatingFpsService
          import com.fpsmonitor.app.util.PermissionUtils
          import com.fpsmonitor.app.util.ShellUtils
          import com.fpsmonitor.app.util.ShizukuUtils
          import rikka.shizuku.Shizuku
          import java.util.Locale

          class MainActivity : AppCompatActivity() {

              private lateinit var binding: ActivityMainBinding
              private var inAppMonitor: ChoreographerMonitor? = null
              private var stressAnimator: ValueAnimator? = null

              private val binderListener = Shizuku.OnBinderReceivedListener {
                  runOnUiThread { refreshPermissionStatus() }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  binding = ActivityMainBinding.inflate(layoutInflater)
                  setContentView(binding.root)

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1002)
                      }
                  }

                  try { Shizuku.addBinderReceivedListenerSticky(binderListener) } catch (_: Throwable) {}

                  setupEnvironmentCheck()
                  setupListeners()
                  setupInAppPreview()
              }

              override fun onResume() {
                  super.onResume()
                  refreshPermissionStatus()
              }

              private fun setupEnvironmentCheck() {
                  refreshPermissionStatus()
                  binding.btnGrantOverlay.setOnClickListener { PermissionUtils.requestOverlayPermission(this) }
                  binding.btnRequestShizuku.setOnClickListener {
                      if (ShizukuUtils.isShizukuAvailable()) {
                          ShizukuUtils.requestShizukuPermission()
                      } else {
                          Toast.makeText(this, "正在连接 Shizuku 服务...", Toast.LENGTH_SHORT).show()
                          refreshPermissionStatus()
                      }
                  }
              }

              private fun refreshPermissionStatus() {
                  val hasOverlay = PermissionUtils.canDrawOverlays(this)
                  binding.tvOverlayStatus.text = if (hasOverlay) "悬浮窗权限: 已授权" else "悬浮窗权限: 未授权"
                  binding.tvOverlayStatus.setTextColor(ContextCompat.getColor(this, if (hasOverlay) R.color.green_accent else R.color.red_accent))
                  binding.btnGrantOverlay.isEnabled = !hasOverlay

                  val isRoot = ShellUtils.isRootAvailable()
                  binding.tvRootStatus.text = if (isRoot) "Root 权限: 已获取" else "Root 权限: 未获取"
                  binding.tvRootStatus.setTextColor(ContextCompat.getColor(this, if (isRoot) R.color.green_accent else R.color.text_secondary))

                  val hasShizuku = ShizukuUtils.hasShizukuPermission() || ShizukuUtils.isShizukuAvailable()
                  binding.tvShizukuStatus.text = if (hasShizuku) "Shizuku 权限: 已授权" else "Shizuku 权限: 待授权"
                  binding.tvShizukuStatus.setTextColor(ContextCompat.getColor(this, if (hasShizuku) R.color.green_accent else R.color.text_secondary))
              }

              private fun setupListeners() {
                  binding.btnStartOverlay.setOnClickListener {
                      if (!PermissionUtils.canDrawOverlays(this)) {
                          Toast.makeText(this, "请先授予悬浮窗权限！", Toast.LENGTH_SHORT).show()
                          PermissionUtils.requestOverlayPermission(this)
                          return@setOnClickListener
                      }

                      val mode = when (binding.rgEngineMode.checkedRadioButtonId) {
                          R.id.rb_surface_flinger -> "SURFACE_FLINGER"
                          R.id.rb_gfxinfo -> "GFXINFO"
                          else -> "CHOREOGRAPHER"
                      }

                      FloatingFpsService.startService(
                          context = this,
                          mode = mode,
                          useRoot = ShellUtils.isRootAvailable(),
                          useShizuku = ShizukuUtils.hasShizukuPermission() || ShizukuUtils.isShizukuAvailable()
                      )
                      Toast.makeText(this, "FPS 悬浮窗已启动", Toast.LENGTH_SHORT).show()
                  }

                  binding.btnStopOverlay.setOnClickListener {
                      FloatingFpsService.stopService(this)
                      Toast.makeText(this, "FPS 悬浮窗已关闭", Toast.LENGTH_SHORT).show()
                  }

                  binding.switchStressTest.setOnCheckedChangeListener { _, isChecked ->
                      if (isChecked) startStressTestAnimation() else stopStressTestAnimation()
                  }
              }

              private fun setupInAppPreview() {
                  inAppMonitor = ChoreographerMonitor()
                  inAppMonitor?.start { data: FpsData ->
                      binding.tvPreviewFps.text = String.format(Locale.US, "%.1f", data.currentFps)
                      binding.tvPreviewFrametime.text = String.format(Locale.US, "%.1f ms", data.frameTimeMs)
                      binding.tvPreviewAvg.text = String.format(Locale.US, "Avg: %.1f", data.avgFps)
                      binding.tvPreviewLow1.text = String.format(Locale.US, "1%% Low: %.1f", data.low1PercentFps)
                      binding.previewWaveform.addDataPoint(data.frameTimeMs.toFloat())
                  }
              }

              private fun startStressTestAnimation() {
                  stressAnimator = ValueAnimator.ofFloat(0f, 360f).apply {
                      duration = 1500
                      repeatCount = ValueAnimator.INFINITE
                      interpolator = LinearInterpolator()
                      addUpdateListener { anim ->
                          binding.ivStressIndicator.rotation = anim.animatedValue as Float
                          if (binding.switchHeavyLoad.isChecked) {
                              var dummy = 0.0
                              for (i in 0..150000) dummy += Math.sin(i.toDouble()) * Math.cos(i.toDouble())
                          }
                      }
                      start()
                  }
              }

              private fun stopStressTestAnimation() {
                  stressAnimator?.cancel()
                  stressAnimator = null
                  binding.ivStressIndicator.rotation = 0f
              }

              override fun onDestroy() {
                  super.onDestroy()
                  try { Shizuku.removeBinderReceivedListener(binderListener) } catch (_: Throwable) {}
                  inAppMonitor?.stop()
                  stopStressTestAnimation()
              }
          }
          MAIN_EOF

          # 12. build.gradle.kts
          cat << 'BUILD_EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          BUILD_EOF

          gradle wrapper --gradle-version 8.2
          ./gradlew assembleDebug --stacktrace -x test -x lint
