              private fun toggleExpandedState() {
                  isExpanded = !isExpanded
                  if (isExpanded) {
                      miniContainer.visibility = View.GONE
                      expandedContainer.visibility = View.VISIBLE
                      refreshUi()
                  } else {
                      miniContainer.visibility = View.VISIBLE
                      expandedContainer.visibility = View.GONE
                  }
                  updateWindowLayout()
              }

              private fun setupTouchDrag() {
                  val dragListener = View.OnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              initialX = params.x
                              initialY = params.y
                              initialTouchX = event.rawX
                              initialTouchY = event.rawY
                              isClickEvent = true
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (event.rawX - initialTouchX).toInt()
                              val dy = (event.rawY - initialTouchY).toInt()
                              if (abs(dx) > 10 || abs(dy) > 10) isClickEvent = false
                              params.x = initialX + dx
                              params.y = initialY + dy
                              updateWindowLayout()
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (isClickEvent) toggleExpandedState()
                              true
                          }
                          else -> false
                      }
                  }
                  miniContainer.setOnTouchListener(dragListener)
                  expandedContainer.setOnTouchListener(dragListener)
              }

              fun updateMetrics(data: FpsData) {
                  mainHandler.post {
                      if (data.currentFps > 0.0) {
                          cachedFps = data.currentFps
                          cachedFrametime = data.frameTimeMs
                          cachedAvgFps = if (data.avgFps > 0) data.avgFps else data.currentFps
                          cachedLow1Fps = if (data.low1PercentFps > 0) data.low1PercentFps else (data.currentFps * 0.90)

                          if (isExpanded) waveformView.addFpsPoint(cachedFps.toFloat())
                          refreshUi()
                      }
                  }
              }

              fun attachToWindow() {
                  mainHandler.post {
                      try {
                          if (rootView.parent == null) windowManager.addView(rootView, params)
                      } catch (e: Throwable) {
                          Log.e("FloatingFpsView", "Error添加悬浮窗失败", e)
                      }
                  }
              }

              fun detachFromWindow() {
                  isDestroyed = true
                  mainHandler.removeCallbacks(statsRunnable)
                  mainHandler.post {
                      try {
                          if (rootView.parent != null) windowManager.removeView(rootView)
                      } catch (_: Throwable) {}
                  }
              }

              private fun updateWindowLayout() {
                  mainHandler.post {
                      try {
                          if (rootView.parent != null) windowManager.updateViewLayout(rootView, params)
                      } catch (_: Throwable) {}
                  }
              }
          }
