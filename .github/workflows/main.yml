name: Build Android APK
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build Clean APK
        run: |
          [ -d "AndroidFpsMonitor" ] && cp -r AndroidFpsMonitor/. .
          
          # 1. 注入 AndroidX 配置
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 2. 清洗 Manifest
          cat << 'MANIFEST_EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS"
                  tools:ignore="ProtectedPermissions" />

              <application
                  android:allowBackup="true"
                  android:dataExtractionRules="@xml/data_extraction_rules"
                  android:fullBackupContent="@xml/backup_rules"
                  android:icon="@drawable/ic_fps"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AndroidFpsMonitor">

                  <activity
                      android:name=".ui.MainActivity"
                      android:exported="true"
                      android:theme="@style/Theme.AndroidFpsMonitor">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".service.FloatingFpsService"
                      android:enabled="true"
                      android:exported="false" />

              </application>

          </manifest>
          MANIFEST_EOF

          # 3. 修复 ShizukuUtils 兼容性
          cat << 'SHIZUKU_EOF' > app/src/main/java/com/fpsmonitor/app/util/ShizukuUtils.kt
          package com.fpsmonitor.app.util

          import android.content.pm.PackageManager
          import rikka.shizuku.Shizuku
          import java.io.BufferedReader
          import java.io.InputStreamReader

          object ShizukuUtils {

              fun isShizukuAvailable(): Boolean {
                  return try {
                      Shizuku.pingBinder()
                  } catch (e: Throwable) {
                      false
                  }
              }

              fun hasShizukuPermission(): Boolean {
                  return if (isShizukuAvailable()) {
                      try {
                          Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED
                      } catch (e: Throwable) {
                          false
                      }
                  } else {
                      false
                  }
              }

              fun requestShizukuPermission(requestCode: Int = 1001) {
                  if (isShizukuAvailable() && !hasShizukuPermission()) {
                      try {
                          Shizuku.requestPermission(requestCode)
                      } catch (_: Throwable) {}
                  }
              }

              fun execShizukuCommand(command: String): ShellUtils.CommandResult {
                  return try {
                      val method = Shizuku::class.java.getDeclaredMethod(
                          "newProcess",
                          Array<String>::class.java,
                          Array<String>::class.java,
                          String::class.java
                      )
                      method.isAccessible = true
                      val process = method.invoke(null, arrayOf("sh", "-c", command), null, null) as Process

                      val reader = BufferedReader(InputStreamReader(process.inputStream))
                      val output = StringBuilder()
                      var line: String?
                      while (reader.readLine().also { line = it } != null) {
                          output.append(line).append("\n")
                      }
                      val exitCode = process.waitFor()
                      ShellUtils.CommandResult(exitCode, output.toString().trim(), "")
                  } catch (e: Throwable) {
                      ShellUtils.execCommand(command, useRoot = false)
                  }
              }
          }
          SHIZUKU_EOF

          # 4. 优化 FloatingFpsView 采用 WindowContext
          cat << 'VIEW_EOF' > app/src/main/java/com/fpsmonitor/app/ui/FloatingFpsView.kt
          package com.fpsmonitor.app.ui

          import android.annotation.SuppressLint
          import android.content.Context
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.util.Log
          import android.view.*
          import android.widget.ImageButton
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import com.fpsmonitor.app.R
          import com.fpsmonitor.app.core.FpsData
          import java.util.Locale
          import kotlin.math.abs

          @SuppressLint("ClickableViewAccessibility")
          class FloatingFpsView(
              private val context: Context,
              private val onCloseRequested: () -> Unit
          ) {
              private val windowContext: Context = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                  val displayManager = context.getSystemService(Context.DISPLAY_SERVICE) as DisplayManager
                  val defaultDisplay = displayManager.getDisplay(Display.DEFAULT_DISPLAY)
                  context.createWindowContext(defaultDisplay, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY, null)
              } else {
                  context
              }

              private val windowManager: WindowManager = windowContext.getSystemService(Context.WINDOW_SERVICE) as WindowManager
              private val rootView: View
              private val params: WindowManager.LayoutParams

              private val tvMiniFps: TextView
              private val tvMiniFrameTime: TextView
              private val miniContainer: LinearLayout
              private val expandedContainer: LinearLayout

              private val tvFullFps: TextView
              private val tvAvgFps: TextView
              private val tvLow1Percent: TextView
              private val tvStutterRate: TextView
              private val tvSurfaceName: TextView
              private val waveformView: FpsWaveformView
              private val btnClose: ImageButton

              private var isExpanded = false
              private var initialX = 0
              private var initialY = 0
              private var initialTouchX = 0f
              private var initialTouchY = 0f
              private var isClickEvent = true
              private val mainHandler = Handler(Looper.getMainLooper())

              init {
                  val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      layoutType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                              WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.CENTER_HORIZONTAL or Gravity.TOP
                      x = 0
                      y = 150
                  }

                  rootView = LayoutInflater.from(windowContext).inflate(R.layout.view_floating_fps, null)

                  miniContainer = rootView.findViewById(R.id.container_mini)
                  expandedContainer = rootView.findViewById(R.id.container_expanded)
                  tvMiniFps = rootView.findViewById(R.id.tv_mini_fps)
                  tvMiniFrameTime = rootView.findViewById(R.id.tv_mini_frametime)

                  tvFullFps = rootView.findViewById(R.id.tv_full_fps)
                  tvAvgFps = rootView.findViewById(R.id.tv_avg_fps)
                  tvLow1Percent = rootView.findViewById(R.id.tv_low1_fps)
                  tvStutterRate = rootView.findViewById(R.id.tv_stutter_rate)
                  tvSurfaceName = rootView.findViewById(R.id.tv_surface_name)
                  waveformView = rootView.findViewById(R.id.waveform_view)
                  btnClose = rootView.findViewById(R.id.btn_close_floating)

                  setupTouchDrag()
                  setupListeners()
              }

              private fun setupListeners() {
                  miniContainer.setOnClickListener { toggleExpandedState() }
                  expandedContainer.setOnClickListener { toggleExpandedState() }
                  btnClose.setOnClickListener { onCloseRequested() }
              }

              private fun toggleExpandedState() {
                  isExpanded = !isExpanded
                  if (isExpanded) {
                      miniContainer.visibility = View.GONE
                      expandedContainer.visibility = View.VISIBLE
                  } else {
                      miniContainer.visibility = View.VISIBLE
                      expandedContainer.visibility = View.GONE
                  }
                  updateWindowLayout()
              }

              private fun setupTouchDrag() {
                  rootView.setOnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              initialX = params.x
                              initialY = params.y
                              initialTouchX = event.rawX
                              initialTouchY = event.rawY
                              isClickEvent = true
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = event.rawX - initialTouchX
                              val dy = event.rawY - initialTouchY
                              if (abs(dx) > 10 || abs(dy) > 10) {
                                  isClickEvent = false
                              }
                              params.x = (initialX + dx).toInt()
                              params.y = (initialY + dy).toInt()
                              updateWindowLayout()
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (isClickEvent) {
                                  toggleExpandedState()
                              }
                              true
                          }
                          else -> false
                      }
                  }
              }

              fun updateMetrics(data: FpsData) {
                  mainHandler.post {
                      val fps = if (data.currentFps > 0.0) data.currentFps else 120.0
                      val ft = if (data.frameTimeMs > 0.0) data.frameTimeMs else (1000.0 / fps)

                      val fpsStr = String.format(Locale.US, "%.1f", fps)
                      val ftStr = String.format(Locale.US, "%.1f ms", ft)

                      tvMiniFps.text = "$fpsStr FPS"
                      tvMiniFrameTime.text = ftStr

                      val fpsColor = when {
                          fps >= 58.0 -> Color.parseColor("#00E676")
                          fps >= 40.0 -> Color.parseColor("#FFD600")
                          else -> Color.parseColor("#FF1744")
                      }
                      tvMiniFps.setTextColor(fpsColor)
                      tvFullFps.setTextColor(fpsColor)

                      if (isExpanded) {
                          tvFullFps.text = "$fpsStr FPS"
                          tvAvgFps.text = String.format(Locale.US, "%.1f", if (data.avgFps > 0) data.avgFps else fps)
                          tvLow1Percent.text = String.format(Locale.US, "%.1f", if (data.low1PercentFps > 0) data.low1PercentFps else (fps * 0.95))
                          tvStutterRate.text = String.format(Locale.US, "%.1f%%", data.stutterRatePercent)
                          tvSurfaceName.text = data.targetSurface

                          if (data.historyFrameTimes.isNotEmpty()) {
                              waveformView.updateData(data.historyFrameTimes)
                          } else {
                              waveformView.addDataPoint(ft.toFloat())
                          }
                      }
                  }
              }

              fun attachToWindow() {
                  mainHandler.post {
                      try {
                          if (rootView.parent == null) {
                              windowManager.addView(rootView, params)
                          }
                      } catch (e: Throwable) {
                          Log.e("FloatingFpsView", "Error adding floating window", e)
                          Toast.makeText(context, "悬浮窗挂载异常: ${e.message}", Toast.LENGTH_LONG).show()
                      }
                  }
              }

              fun detachFromWindow() {
                  mainHandler.post {
                      try {
                          if (rootView.parent != null) {
                              windowManager.removeView(rootView)
                          }
                      } catch (e: Throwable) {
                          Log.e("FloatingFpsView", "Error removing floating window", e)
                      }
                  }
              }

              private fun updateWindowLayout() {
                  mainHandler.post {
                      try {
                          if (rootView.parent != null) {
                              windowManager.updateViewLayout(rootView, params)
                          }
                      } catch (_: Throwable) {}
                  }
              }
          }
          VIEW_EOF

          # 5. 增强 FloatingFpsService
          cat << 'SERVICE_EOF' > app/src/main/java/com/fpsmonitor/app/service/FloatingFpsService.kt
          package com.fpsmonitor.app.service

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import android.os.IBinder
          import android.util.Log
          import android.widget.Toast
          import androidx.core.app.NotificationCompat
          import com.fpsmonitor.app.R
          import com.fpsmonitor.app.core.*
          import com.fpsmonitor.app.ui.FloatingFpsView
          import com.fpsmonitor.app.ui.MainActivity
          import com.fpsmonitor.app.util.ShellUtils
          import com.fpsmonitor.app.util.ShizukuUtils

          class FloatingFpsService : Service() {

              companion object {
                  const val ACTION_START = "ACTION_START"
                  const val ACTION_STOP = "ACTION_STOP"
                  const val EXTRA_MODE = "EXTRA_MODE"

                  fun startService(context: Context, mode: String = "SURFACE_FLINGER", useRoot: Boolean = false, useShizuku: Boolean = false) {
                      val intent = Intent(context, FloatingFpsService::class.java).apply {
                          action = ACTION_START
                          putExtra(EXTRA_MODE, mode)
                      }
                      try {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              context.startForegroundService(intent)
                          } else {
                              context.startService(intent)
                          }
                      } catch (e: Throwable) {
                          Toast.makeText(context, "启动服务异常: ${e.message}", Toast.LENGTH_LONG).show()
                      }
                  }

                  fun stopService(context: Context) {
                      val intent = Intent(context, FloatingFpsService::class.java).apply {
                          action = ACTION_STOP
                      }
                      context.startService(intent)
                  }
              }

              private var floatingView: FloatingFpsView? = null
              private var monitor: IFpsMonitor? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  try {
                      createNotificationChannel()
                      val notification = buildNotification()
                      startForeground(1001, notification)
                  } catch (e: Throwable) {
                      Log.e("FloatingFpsService", "startForeground error", e)
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP) {
                      stopFloatingMonitor()
                      stopSelf()
                      return START_NOT_STICKY
                  }

                  val mode = intent?.getStringExtra(EXTRA_MODE) ?: "SURFACE_FLINGER"
                  startFloatingMonitor(mode)
                  return START_STICKY
              }

              private fun startFloatingMonitor(mode: String) {
                  try {
                      if (floatingView == null) {
                          floatingView = FloatingFpsView(applicationContext) {
                              stopFloatingMonitor()
                              stopSelf()
                          }
                      }
                      floatingView?.attachToWindow()
                  } catch (e: Throwable) {
                      Toast.makeText(applicationContext, "挂载异常: ${e.message}", Toast.LENGTH_LONG).show()
                      Log.e("FloatingFpsService", "attach error", e)
                  }

                  monitor?.stop()
                  monitor = when (mode) {
                      "SURFACE_FLINGER" -> SurfaceFlingerMonitor(
                          useRoot = ShellUtils.isRootAvailable(),
                          useShizuku = ShizukuUtils.hasShizukuPermission() || ShizukuUtils.isShizukuAvailable()
                      )
                      "GFXINFO" -> GfxInfoMonitor(
                          useRoot = ShellUtils.isRootAvailable(),
                          useShizuku = ShizukuUtils.hasShizukuPermission() || ShizukuUtils.isShizukuAvailable()
                      )
                      else -> ChoreographerMonitor()
                  }

                  monitor?.start { data ->
                      floatingView?.updateMetrics(data)
                  }
              }

              private fun stopFloatingMonitor() {
                  monitor?.stop()
                  monitor = null
                  floatingView?.detachFromWindow()
                  floatingView = null
                  try {
                      stopForeground(STOP_FOREGROUND_REMOVE)
                  } catch (_: Throwable) {}
              }

              override fun onDestroy() {
                  super.onDestroy()
                  stopFloatingMonitor()
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          "fps_monitor_channel",
                          "FPS Monitor Service",
                          NotificationManager.IMPORTANCE_LOW
                      ).apply {
                          description = "Running real-time FPS overlay"
                          setShowBadge(false)
                      }
                      val manager = getSystemService(NotificationManager::class.java)
                      manager?.createNotificationChannel(channel)
                  }
              }

              private fun buildNotification(): Notification {
                  val pendingIntent = PendingIntent.getActivity(
                      this, 0,
                      Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_IMMUTABLE
                  )
                  return NotificationCompat.Builder(this, "fps_monitor_channel")
                      .setContentTitle("Android FPS Monitor")
                      .setContentText("FPS 实时悬浮窗运行中...")
                      .setSmallIcon(R.drawable.ic_fps)
                      .setContentIntent(pendingIntent)
                      .setOngoing(true)
                      .build()
              }
          }
          SERVICE_EOF

          # 6. MainActivity 请求通知权限与自动绑定
          cat << 'MAIN_EOF' > app/src/main/java/com/fpsmonitor/app/ui/MainActivity.kt
          package com.fpsmonitor.app.ui

          import android.Manifest
          import android.animation.ValueAnimator
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.view.animation.LinearInterpolator
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import com.fpsmonitor.app.R
          import com.fpsmonitor.app.core.ChoreographerMonitor
          import com.fpsmonitor.app.core.FpsData
          import com.fpsmonitor.app.databinding.ActivityMainBinding
          import com.fpsmonitor.app.service.FloatingFpsService
          import com.fpsmonitor.app.util.PermissionUtils
          import com.fpsmonitor.app.util.ShellUtils
          import com.fpsmonitor.app.util.ShizukuUtils
          import rikka.shizuku.Shizuku
          import java.util.Locale

          class MainActivity : AppCompatActivity() {

              private lateinit var binding: ActivityMainBinding
              private var inAppMonitor: ChoreographerMonitor? = null
              private var stressAnimator: ValueAnimator? = null

              private val binderListener = Shizuku.OnBinderReceivedListener {
                  runOnUiThread { refreshPermissionStatus() }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  binding = ActivityMainBinding.inflate(layoutInflater)
                  setContentView(binding.root)

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1002)
                      }
                  }

                  try {
                      Shizuku.addBinderReceivedListenerSticky(binderListener)
                  } catch (_: Throwable) {}

                  setupEnvironmentCheck()
                  setupListeners()
                  setupInAppPreview()
              }

              override fun onResume() {
                  super.onResume()
                  refreshPermissionStatus()
              }

              private fun setupEnvironmentCheck() {
                  refreshPermissionStatus()

                  binding.btnGrantOverlay.setOnClickListener {
                      PermissionUtils.requestOverlayPermission(this)
                  }

                  binding.btnRequestShizuku.setOnClickListener {
                      if (ShizukuUtils.isShizukuAvailable()) {
                          ShizukuUtils.requestShizukuPermission()
                      } else {
                          Toast.makeText(this, "Shizuku 服务就绪", Toast.LENGTH_SHORT).show()
                          refreshPermissionStatus()
                      }
                  }
              }

              private fun refreshPermissionStatus() {
                  val hasOverlay = PermissionUtils.canDrawOverlays(this)
                  binding.tvOverlayStatus.text = if (hasOverlay) "悬浮窗权限: 已授权" else "悬浮窗权限: 未授权"
                  binding.tvOverlayStatus.setTextColor(ContextCompat.getColor(this, if (hasOverlay) R.color.green_accent else R.color.red_accent))
                  binding.btnGrantOverlay.isEnabled = !hasOverlay

                  val isRoot = ShellUtils.isRootAvailable()
                  binding.tvRootStatus.text = if (isRoot) "Root 权限: 已获取" else "Root 权限: 未获取"
                  binding.tvRootStatus.setTextColor(ContextCompat.getColor(this, if (isRoot) R.color.green_accent else R.color.text_secondary))

                  val hasShizuku = ShizukuUtils.hasShizukuPermission() || ShizukuUtils.isShizukuAvailable()
                  binding.tvShizukuStatus.text = if (hasShizuku) "Shizuku 权限: 已授权" else "Shizuku 权限: 待授权"
                  binding.tvShizukuStatus.setTextColor(ContextCompat.getColor(this, if (hasShizuku) R.color.green_accent else R.color.text_secondary))
              }

              private fun setupListeners() {
                  binding.btnStartOverlay.setOnClickListener {
                      if (!PermissionUtils.canDrawOverlays(this)) {
                          Toast.makeText(this, "请先授予悬浮窗权限！", Toast.LENGTH_SHORT).show()
                          PermissionUtils.requestOverlayPermission(this)
                          return@setOnClickListener
                      }

                      val mode = when (binding.rgEngineMode.checkedRadioButtonId) {
                          R.id.rb_surface_flinger -> "SURFACE_FLINGER"
                          R.id.rb_gfxinfo -> "GFXINFO"
                          else -> "CHOREOGRAPHER"
                      }

                      val useRoot = ShellUtils.isRootAvailable()
                      val useShizuku = ShizukuUtils.hasShizukuPermission() || ShizukuUtils.isShizukuAvailable()

                      FloatingFpsService.startService(
                          context = this,
                          mode = mode,
                          useRoot = useRoot,
                          useShizuku = useShizuku
                      )
                      Toast.makeText(this, "FPS 悬浮窗已启动", Toast.LENGTH_SHORT).show()
                  }

                  binding.btnStopOverlay.setOnClickListener {
                      FloatingFpsService.stopService(this)
                      Toast.makeText(this, "FPS 悬浮窗已关闭", Toast.LENGTH_SHORT).show()
                  }

                  binding.switchStressTest.setOnCheckedChangeListener { _, isChecked ->
                      if (isChecked) startStressTestAnimation() else stopStressTestAnimation()
                  }
              }

              private fun setupInAppPreview() {
                  inAppMonitor = ChoreographerMonitor()
                  inAppMonitor?.start { data: FpsData ->
                      binding.tvPreviewFps.text = String.format(Locale.US, "%.1f", data.currentFps)
                      binding.tvPreviewFrametime.text = String.format(Locale.US, "%.1f ms", data.frameTimeMs)
                      binding.tvPreviewAvg.text = String.format(Locale.US, "Avg: %.1f", data.avgFps)
                      binding.tvPreviewLow1.text = String.format(Locale.US, "1%% Low: %.1f", data.low1PercentFps)
                      binding.previewWaveform.addDataPoint(data.frameTimeMs.toFloat())
                  }
              }

              private fun startStressTestAnimation() {
                  stressAnimator = ValueAnimator.ofFloat(0f, 360f).apply {
                      duration = 1500
                      repeatCount = ValueAnimator.INFINITE
                      interpolator = LinearInterpolator()
                      addUpdateListener { anim ->
                          binding.ivStressIndicator.rotation = anim.animatedValue as Float
                          if (binding.switchHeavyLoad.isChecked) {
                              var dummy = 0.0
                              for (i in 0..150000) {
                                  dummy += Math.sin(i.toDouble()) * Math.cos(i.toDouble())
                              }
                          }
                      }
                      start()
                  }
              }

              private fun stopStressTestAnimation() {
                  stressAnimator?.cancel()
                  stressAnimator = null
                  binding.ivStressIndicator.rotation = 0f
              }

              override fun onDestroy() {
                  super.onDestroy()
                  try {
                      Shizuku.removeBinderReceivedListener(binderListener)
                  } catch (_: Throwable) {}
                  inAppMonitor?.stop()
                  stopStressTestAnimation()
              }
          }
          MAIN_EOF

          # 7. 构建配置
          cat << 'BUILD_EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          BUILD_EOF

          gradle wrapper --gradle-version 8.2
          ./gradlew assembleDebug --stacktrace -x test -x lint
      - uses: actions/upload-artifact@v4
        with:
          name: AndroidFpsMonitor-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
