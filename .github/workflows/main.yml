          # 7. ShizukuUtils (极速非阻塞执行，自动销毁进程)
          cat << 'SHIZUKU_EOF' > app/src/main/java/com/fpsmonitor/app/util/ShizukuUtils.kt
          package com.fpsmonitor.app.util

          import android.content.pm.PackageManager
          import rikka.shizuku.Shizuku
          import java.io.BufferedReader
          import java.io.InputStreamReader

          object ShizukuUtils {
              fun isShizukuAvailable(): Boolean = try { Shizuku.pingBinder() } catch (_: Throwable) { false }

              fun hasShizukuPermission(): Boolean = if (isShizukuAvailable()) {
                  try { Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED } catch (_: Throwable) { false }
              } else false

              fun requestShizukuPermission(requestCode: Int = 1001) {
                  if (isShizukuAvailable() && !hasShizukuPermission()) {
                      try { Shizuku.requestPermission(requestCode) } catch (_: Throwable) {}
                  }
              }

              fun execShizukuCommand(command: String): ShellUtils.CommandResult {
                  var process: Process? = null
                  return try {
                      val method = Shizuku::class.java.getDeclaredMethod(
                          "newProcess",
                          Array<String>::class.java,
                          Array<String>::class.java,
                          String::class.java
                      )
                      method.isAccessible = true
                      process = method.invoke(null, arrayOf("sh", "-c", command), null, null) as Process

                      val reader = BufferedReader(InputStreamReader(process.inputStream), 4096)
                      val output = StringBuilder()
                      var line: String?
                      while (reader.readLine().also { line = it } != null) {
                          output.append(line).append("\n")
                          if (output.length > 32768) break
                      }
                      reader.close()
                      process.destroy()

                      ShellUtils.CommandResult(0, output.toString().trim(), "")
                  } catch (e: Throwable) {
                      try { process?.destroy() } catch (_: Throwable) {}
                      ShellUtils.execCommand(command, useRoot = ShellUtils.isRootAvailable())
                  }
              }
          }
          SHIZUKU_EOF

          # 8. 无状态环形缓冲 FPS 计算引擎 (修复 FpsData 参数)
          cat << 'ENGINE_EOF' > app/src/main/java/com/fpsmonitor/app/core/SurfaceFlingerMonitor.kt
          package com.fpsmonitor.app.core

          import com.fpsmonitor.app.util.ShellUtils
          import com.fpsmonitor.app.util.ShizukuUtils
          import kotlinx.coroutines.*

          class SurfaceFlingerMonitor(
              private val useRoot: Boolean = false,
              private val useShizuku: Boolean = true
          ) : IFpsMonitor {

              private var job: Job? = null
              private val scope = CoroutineScope(Dispatchers.IO + SupervisorJob())

              private var targetSurface: String? = null
              private var lastLayerScanTimeMs = 0L

              override var isRunning: Boolean = false
                  private set

              override fun start(onFpsUpdate: (FpsData) -> Unit) {
                  if (isRunning) return
                  isRunning = true
                  targetSurface = null
                  lastLayerScanTimeMs = 0L

                  job = scope.launch {
                      while (isActive && isRunning) {
                          try {
                              val now = System.currentTimeMillis()

                              // 1. 每 2 秒扫描一次活跃渲染图层（优先定位游戏 SurfaceView）
                              if (targetSurface == null || now - lastLayerScanTimeMs > 2000L) {
                                  targetSurface = scanTargetSurface()
                                  lastLayerScanTimeMs = now
                              }

                              // 2. 查询 SurfaceFlinger Latency (优先查游戏图层，没有则查 Display)
                              val cmd = if (!targetSurface.isNullOrEmpty()) {
                                  "dumpsys SurfaceFlinger --latency \"$targetSurface\""
                              } else {
                                  "dumpsys SurfaceFlinger --latency"
                              }

                              var res = execShell(cmd)
                              if (!res.isSuccess || res.stdout.isBlank() || res.stdout.lines().size < 3) {
                                  targetSurface = null
                                  res = execShell("dumpsys SurfaceFlinger --latency")
                              }

                              if (res.isSuccess && res.stdout.isNotBlank()) {
                                  val data = parseBufferToFps(res.stdout)
                                  if (data != null) {
                                      withContext(Dispatchers.Main) {
                                          onFpsUpdate(data)
                                      }
                                  }
                              }
                          } catch (_: Throwable) {}
                          delay(200L) // 200ms 高频丝滑更新，每秒 5 次完全无阻塞
                      }
                  }
              }

              override fun stop() {
                  isRunning = false
                  job?.cancel()
                  job = null
              }

              private fun scanTargetSurface(): String? {
                  try {
                      val res = execShell("dumpsys SurfaceFlinger --list")
                      if (res.isSuccess && res.stdout.isNotBlank()) {
                          val lines = res.stdout.lines().map { it.trim() }.filter { it.isNotEmpty() }

                          // 优先一：游戏专属 SurfaceView 图层
                          val gameSurface = lines.firstOrNull { 
                              it.contains("SurfaceView", ignoreCase = true) && 
                              !it.contains("com.fpsmonitor.app", ignoreCase = true) &&
                              !it.contains("Background") &&
                              !it.contains("Snapshot")
                          }
                          if (gameSurface != null) return gameSurface

                          // 优先二：前台活跃应用主图层
                          val appLayer = lines.firstOrNull {
                              !it.contains("StatusBar", ignoreCase = true) &&
                              !it.contains("NavigationBar", ignoreCase = true) &&
                              !it.contains("Wallpaper", ignoreCase = true) &&
                              !it.contains("NotificationShade", ignoreCase = true) &&
                              !it.contains("Background", ignoreCase = true) &&
                              !it.contains("Snapshot", ignoreCase = true) &&
                              !it.contains("com.fpsmonitor.app", ignoreCase = true) &&
                              (it.contains("#0") || it.contains("#1"))
                          }
                          if (appLayer != null) return appLayer
                      }
                  } catch (_: Throwable) {}
                  return null
              }

              /**
               * 直接从 SurfaceFlinger 127 帧环形缓冲区中提取最近渲染帧计算 FPS
               * 无状态设计，彻底解决跨应用切换时时间戳错位导致的卡死
               */
              private fun parseBufferToFps(raw: String): FpsData? {
                  val lines = raw.lines().filter { it.isNotBlank() }
                  if (lines.size < 3) return null

                  val timestamps = ArrayList<Long>()

                  for (i in 1 until lines.size) {
                      val line = lines[i]
                      val tokens = line.trim().split("\\s+".toRegex())
                      if (tokens.size < 3) continue

                      val desiredTime = tokens.getOrNull(0)?.toLongOrNull() ?: 0L
                      val actualTime = tokens.getOrNull(1)?.toLongOrNull() ?: 0L
                      val readyTime = tokens.getOrNull(2)?.toLongOrNull() ?: 0L

                      val ts = when {
                          actualTime in 1L..(Long.MAX_VALUE - 10000000L) -> actualTime
                          readyTime in 1L..(Long.MAX_VALUE - 10000000L) -> readyTime
                          desiredTime in 1L..(Long.MAX_VALUE - 10000000L) -> desiredTime
                          else -> 0L
                      }

                      if (ts > 0L) {
                          timestamps.add(ts)
                      }
                  }

                  if (timestamps.size < 2) return null

                  // 提取缓冲区末尾最近 35 帧
                  val recent = timestamps.takeLast(35)
                  val deltas = ArrayList<Float>()

                  for (i in 1 until recent.size) {
                      val deltaNs = recent[i] - recent[i - 1]
                      val deltaMs = deltaNs / 1_000_000.0f
                      if (deltaMs in 4.0f..400.0f) {
                          deltas.add(deltaMs)
                      }
                  }

                  if (deltas.isEmpty()) return null

                  val avgDelta = deltas.average().toFloat()
                  val currentFps = if (avgDelta > 0f) (1000.0f / avgDelta).toDouble() else 60.0

                  val sortedDeltas = ArrayList(deltas)
                  sortedDeltas.sortDescending()
                  val p95Idx = (sortedDeltas.size * 0.10f).toInt().coerceIn(0, sortedDeltas.size - 1)
                  val p95Delta = sortedDeltas[p95Idx]
                  val low1Percent = if (p95Delta > 0f) (1000.0f / p95Delta).toDouble() else currentFps

                  return FpsData(
                      currentFps = currentFps,
                      frameTimeMs = avgDelta.toDouble(),
                      avgFps = currentFps,
                      low1PercentFps = low1Percent
                  )
              }

              private fun execShell(command: String): ShellUtils.CommandResult {
                  return when {
                      ShizukuUtils.hasShizukuPermission() || ShizukuUtils.isShizukuAvailable() -> ShizukuUtils.execShizukuCommand(command)
                      useRoot -> ShellUtils.execCommand(command, useRoot = true)
                      else -> ShellUtils.execCommand(command, useRoot = false)
                  }
              }
          }
          ENGINE_EOF

