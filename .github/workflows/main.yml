name: Build Android APK
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build Clean APK
        run: |
          [ -d "AndroidFpsMonitor" ] && cp -r AndroidFpsMonitor/. .
          
          # 1. 注入 AndroidX 配置
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 2. 清洗 Manifest
          cat << 'MANIFEST_EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS"
                  tools:ignore="ProtectedPermissions" />

              <application
                  android:allowBackup="true"
                  android:dataExtractionRules="@xml/data_extraction_rules"
                  android:fullBackupContent="@xml/backup_rules"
                  android:icon="@drawable/ic_fps"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AndroidFpsMonitor">

                  <activity
                      android:name=".ui.MainActivity"
                      android:exported="true"
                      android:theme="@style/Theme.AndroidFpsMonitor">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".service.FloatingFpsService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Realtime gaming FPS and system display performance monitor overlay." />
                  </service>

              </application>

          </manifest>
          MANIFEST_EOF

          # 3. 修复 ShizukuUtils 兼容性
          cat << 'SHIZUKU_EOF' > app/src/main/java/com/fpsmonitor/app/util/ShizukuUtils.kt
          package com.fpsmonitor.app.util

          import android.content.pm.PackageManager
          import rikka.shizuku.Shizuku
          import java.io.BufferedReader
          import java.io.InputStreamReader

          object ShizukuUtils {

              fun isShizukuAvailable(): Boolean {
                  return try {
                      Shizuku.pingBinder()
                  } catch (e: Throwable) {
                      false
                  }
              }

              fun hasShizukuPermission(): Boolean {
                  return if (isShizukuAvailable()) {
                      try {
                          Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED
                      } catch (e: Throwable) {
                          false
                      }
                  } else {
                      false
                  }
              }

              fun requestShizukuPermission(requestCode: Int = 1001) {
                  if (isShizukuAvailable() && !hasShizukuPermission()) {
                      try {
                          Shizuku.requestPermission(requestCode)
                      } catch (_: Throwable) {}
                  }
              }

              fun execShizukuCommand(command: String): ShellUtils.CommandResult {
                  return try {
                      val method = Shizuku::class.java.getDeclaredMethod(
                          "newProcess",
                          Array<String>::class.java,
                          Array<String>::class.java,
                          String::class.java
                      )
                      method.isAccessible = true
                      val process = method.invoke(null, arrayOf("sh", "-c", command), null, null) as Process

                      val reader = BufferedReader(InputStreamReader(process.inputStream))
                      val output = StringBuilder()
                      var line: String?
                      while (reader.readLine().also { line = it } != null) {
                          output.append(line).append("\n")
                      }
                      val exitCode = process.waitFor()
                      ShellUtils.CommandResult(exitCode, output.toString().trim(), "")
                  } catch (e: Throwable) {
                      ShellUtils.execCommand(command, useRoot = false)
                  }
              }
          }
          SHIZUKU_EOF
          
          # 4. 构建配置
          cat << 'BUILD_EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          BUILD_EOF

          # 5. 生成 Wrapper 并编译
          gradle wrapper --gradle-version 8.2
          ./gradlew assembleDebug --stacktrace -x test -x lint
      - uses: actions/upload-artifact@v4
        with:
          name: AndroidFpsMonitor-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
