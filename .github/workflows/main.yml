name: Build Android APK
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build Pro Gaming HUD & Hardware Gauges APK
        run: |
          [ -d "AndroidFpsMonitor" ] && cp -r AndroidFpsMonitor/. .
          
          # 1. 注入 AndroidX 配置
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 2. 清洗 Manifest
          cat << 'MANIFEST_EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS"
                  tools:ignore="ProtectedPermissions" />

              <application
                  android:allowBackup="true"
                  android:dataExtractionRules="@xml/data_extraction_rules"
                  android:fullBackupContent="@xml/backup_rules"
                  android:icon="@drawable/ic_fps"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AndroidFpsMonitor">

                  <activity
                      android:name=".ui.MainActivity"
                      android:exported="true"
                      android:theme="@style/Theme.AndroidFpsMonitor">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".service.FloatingFpsService"
                      android:enabled="true"
                      android:exported="false" />

                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:multiprocess="false"
                      android:enabled="true"
                      android:exported="true"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL"
                      tools:replace="android:authorities" />

              </application>

          </manifest>
          MANIFEST_EOF

          # 3. 硬件跑车仪表盘 View (用于 CPU负载率、RAM占用率、SOC温度)
          cat << 'GAUGE_EOF' > app/src/main/java/com/fpsmonitor/app/ui/HardwareGaugeView.kt
          package com.fpsmonitor.app.ui

          import android.content.Context
          import android.graphics.*
          import android.util.AttributeSet
          import android.view.View
          import kotlin.math.cos
          import kotlin.math.sin

          class HardwareGaugeView @JvmOverloads constructor(
              context: Context,
              attrs: AttributeSet? = null,
              defStyleAttr: Int = 0
          ) : View(context, attrs, defStyleAttr) {

              private var title: String = "CPU"
              private var unit: String = "%"
              private var currentValue: Float = 0f
              private var maxValue: Float = 100f
              private var redlineThreshold: Float = 80f
              private var accentColor: Int = Color.parseColor("#C084FC")
              private var redlineColor: Int = Color.parseColor("#FF1744")

              private val bgArcPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeWidth = 8f
                  strokeCap = Paint.Cap.ROUND
                  color = Color.parseColor("#1E293B")
              }

              private val sweepArcPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeWidth = 8f
                  strokeCap = Paint.Cap.ROUND
              }

              private val tickPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeWidth = 1.5f
                  color = Color.parseColor("#475569")
              }

              private val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  textAlign = Paint.Align.CENTER
                  typeface = Typeface.DEFAULT_BOLD
              }

              private val arcRect = RectF()

              fun setupGauge(title: String, unit: String, maxValue: Float, redlineThreshold: Float, accentColorHex: String) {
                  this.title = title
                  this.unit = unit
                  this.maxValue = maxValue
                  this.redlineThreshold = redlineThreshold
                  this.accentColor = Color.parseColor(accentColorHex)
                  invalidate()
              }

              fun setValue(value: Float) {
                  this.currentValue = value.coerceIn(0f, maxValue)
                  postInvalidateOnAnimation()
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val w = width.toFloat()
                  val h = height.toFloat()
                  if (w <= 0 || h <= 0) return

                  val cx = w / 2f
                  val cy = h * 0.54f
                  val radius = (w.coerceAtMost(h) / 2f) - 10f

                  arcRect.set(cx - radius, cy - radius, cx + radius, cy + radius)

                  val startAngle = 140f
                  val sweepTotalAngle = 260f

                  // 1. 底层暗色圆弧
                  canvas.drawArc(arcRect, startAngle, sweepTotalAngle, false, bgArcPaint)

                  // 2. 刻度线
                  val totalTicks = 16
                  for (i in 0..totalTicks) {
                      val angleDeg = startAngle + (i.toFloat() / totalTicks) * sweepTotalAngle
                      val rad = Math.toRadians(angleDeg.toDouble())

                      val isMajor = i % 4 == 0
                      val tickLen = if (isMajor) 8f else 5f
                      val isRedline = (i.toFloat() / totalTicks) * maxValue >= redlineThreshold

                      tickPaint.strokeWidth = if (isMajor) 2f else 1f
                      tickPaint.color = when {
                          isRedline -> redlineColor
                          isMajor -> Color.parseColor("#94A3B8")
                          else -> Color.parseColor("#334155")
                      }

                      val outerX = cx + (radius - 6f) * cos(rad).toFloat()
                      val outerY = cy + (radius - 6f) * sin(rad).toFloat()
                      val innerX = cx + (radius - 6f - tickLen) * cos(rad).toFloat()
                      val innerY = cy + (radius - 6f - tickLen) * sin(rad).toFloat()

                      canvas.drawLine(innerX, innerY, outerX, outerY, tickPaint)
                  }

                  // 3. 动态流光渐变彩色进度弧
                  val progressRatio = (currentValue / maxValue).coerceIn(0f, 1f)
                  val activeSweep = progressRatio * sweepTotalAngle

                  if (activeSweep > 0f) {
                      val isHigh = currentValue >= redlineThreshold
                      sweepArcPaint.color = if (isHigh) redlineColor else accentColor
                      canvas.drawArc(arcRect, startAngle, activeSweep, false, sweepArcPaint)
                  }

                  // 4. 标题与数值
                  textPaint.color = Color.parseColor("#94A3B8")
                  textPaint.textSize = radius * 0.24f
                  canvas.drawText(title, cx, cy - (radius * 0.16f), textPaint)

                  textPaint.color = if (currentValue >= redlineThreshold) redlineColor else Color.parseColor("#FFFFFF")
                  textPaint.textSize = radius * 0.40f
                  val valFormatted = if (unit == "°C") String.format("%.1f", currentValue) else String.format("%.0f", currentValue)
                  canvas.drawText(valFormatted + unit, cx, cy + (radius * 0.26f), textPaint)
              }
          }
          GAUGE_EOF

          # 4. 实时动态连续波形 View (支持 addFpsPoint 与 addDataPoint 兼容调用)
          cat << 'WAVE_VIEW_EOF' > app/src/main/java/com/fpsmonitor/app/ui/FpsWaveformView.kt
          package com.fpsmonitor.app.ui

          import android.content.Context
          import android.graphics.*
          import android.util.AttributeSet
          import android.view.View

          class FpsWaveformView @JvmOverloads constructor(
              context: Context,
              attrs: AttributeSet? = null,
              defStyleAttr: Int = 0
          ) : View(context, attrs, defStyleAttr) {

              private val maxPoints = 80
              private val dataPoints = ArrayList<Float>(maxPoints)

              private val linePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeWidth = 3f
                  strokeCap = Paint.Cap.ROUND
                  strokeJoin = Paint.Join.ROUND
                  color = Color.parseColor("#00E676")
              }

              private val fillPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.FILL
              }

              private val gridPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeWidth = 1f
                  color = Color.parseColor("#25FFFFFF")
                  pathEffect = DashPathEffect(floatArrayOf(5f, 5f), 0f)
              }

              private val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  textSize = 20f
                  color = Color.parseColor("#64748B")
                  typeface = Typeface.DEFAULT_BOLD
              }

              private val path = Path()
              private val fillPath = Path()

              init {
                  for (i in 0 until maxPoints) {
                      dataPoints.add(60f)
                  }
              }

              fun addDataPoint(value: Float) {
                  addFpsPoint(value)
              }

              fun addFpsPoint(fps: Float) {
                  synchronized(dataPoints) {
                      if (dataPoints.size >= maxPoints) {
                          dataPoints.removeAt(0)
                      }
                      dataPoints.add(fps.coerceIn(0f, 150f))
                  }
                  postInvalidateOnAnimation()
              }

              fun updateData(list: List<Float>) {
                  synchronized(dataPoints) {
                      dataPoints.clear()
                      for (v in list.takeLast(maxPoints)) {
                          dataPoints.add(v)
                      }
                      while (dataPoints.size < maxPoints) {
                          dataPoints.add(0, 60f)
                      }
                  }
                  postInvalidateOnAnimation()
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val w = width.toFloat()
                  val h = height.toFloat()
                  if (w <= 0 || h <= 0) return

                  // 绘制 30, 60, 120 FPS 虚线基准线
                  val y30 = h * (1f - 30f / 144f)
                  val y60 = h * (1f - 60f / 144f)
                  val y120 = h * (1f - 120f / 144f)

                  canvas.drawLine(0f, y30, w, y30, gridPaint)
                  canvas.drawLine(0f, y60, w, y60, gridPaint)
                  canvas.drawLine(0f, y120, w, y120, gridPaint)

                  canvas.drawText("60", 6f, y60 - 3f, textPaint)
                  canvas.drawText("120", 6f, y120 - 3f, textPaint)

                  path.reset()
                  fillPath.reset()

                  val points: List<Float>
                  synchronized(dataPoints) {
                      points = ArrayList(dataPoints)
                  }
                  if (points.size < 2) return

                  val stepX = w / (maxPoints - 1).toFloat()
                  var latestFps = 60f

                  for (i in points.indices) {
                      val fps = points[i]
                      val x = i * stepX
                      val y = (h - (fps / 144f * (h - 8f))).coerceIn(4f, h - 4f)

                      if (i == 0) {
                          path.moveTo(x, y)
                          fillPath.moveTo(x, h)
                          fillPath.lineTo(x, y)
                      } else {
                          val prevFps = points[i - 1]
                          val prevX = (i - 1) * stepX
                          val prevY = (h - (prevFps / 144f * (h - 8f))).coerceIn(4f, h - 4f)
                          val cX = (prevX + x) / 2f
                          path.cubicTo(cX, prevY, cX, y, x, y)
                          fillPath.cubicTo(cX, prevY, cX, y, x, y)
                      }

                      if (i == points.size - 1) {
                          latestFps = fps
                          fillPath.lineTo(x, h)
                          fillPath.close()
                      }
                  }

                  val mainColor = when {
                      latestFps >= 55f -> Color.parseColor("#00E676")
                      latestFps >= 40f -> Color.parseColor("#FFD600")
                      else -> Color.parseColor("#FF1744")
                  }
                  linePaint.color = mainColor

                  fillPaint.shader = LinearGradient(
                      0f, 0f, 0f, h,
                      mainColor and 0x40FFFFFF,
                      Color.TRANSPARENT,
                      Shader.TileMode.CLAMP
                  )

                  canvas.drawPath(fillPath, fillPaint)
                  canvas.drawPath(path, linePaint)
              }
          }
          WAVE_VIEW_EOF

          # 5. 电竞 HUD + 硬件三联表盘布局
          cat << 'LAYOUT_EOF' > app/src/main/res/layout/view_floating_fps.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="wrap_content"
              android:layout_height="wrap_content">

              <!-- 极简迷你仪表胶囊 -->
              <LinearLayout
                  android:id="@+id/container_mini"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:background="@drawable/bg_floating_mini"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  android:paddingStart="12dp"
                  android:paddingEnd="12dp"
                  android:paddingTop="6dp"
                  android:paddingBottom="6dp"
                  android:visibility="visible">

                  <!-- FPS 徽章 -->
                  <LinearLayout
                      android:id="@+id/badge_mini_fps"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">
                      <TextView
                          android:id="@+id/tv_mini_fps"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="60 FPS"
                          android:textColor="#00E676"
                          android:textSize="13sp"
                          android:textStyle="bold" />
                  </LinearLayout>

                  <!-- CPU 徽章 -->
                  <LinearLayout
                      android:id="@+id/badge_mini_cpu"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">
                      <View
                          android:layout_width="1dp"
                          android:layout_height="10dp"
                          android:layout_marginStart="6dp"
                          android:layout_marginEnd="6dp"
                          android:background="#40FFFFFF" />
                      <TextView
                          android:id="@+id/tv_mini_cpu"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="CPU 25%"
                          android:textColor="#C084FC"
                          android:textSize="12sp"
                          android:textStyle="bold" />
                  </LinearLayout>

                  <!-- RAM 徽章 -->
                  <LinearLayout
                      android:id="@+id/badge_mini_ram"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">
                      <View
                          android:layout_width="1dp"
                          android:layout_height="10dp"
                          android:layout_marginStart="6dp"
                          android:layout_marginEnd="6dp"
                          android:background="#40FFFFFF" />
                      <TextView
                          android:id="@+id/tv_mini_ram"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="RAM 58%"
                          android:textColor="#38BDF8"
                          android:textSize="12sp"
                          android:textStyle="bold" />
                  </LinearLayout>

                  <!-- 温度徽章 -->
                  <LinearLayout
                      android:id="@+id/badge_mini_temp"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">
                      <View
                          android:layout_width="1dp"
                          android:layout_height="10dp"
                          android:layout_marginStart="6dp"
                          android:layout_marginEnd="6dp"
                          android:background="#40FFFFFF" />
                      <TextView
                          android:id="@+id/tv_mini_temp"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="35.5°C"
                          android:textColor="#FBBF24"
                          android:textSize="12sp"
                          android:textStyle="bold" />
                  </LinearLayout>

              </LinearLayout>

              <!-- 展开电竞 HUD 卡片 -->
              <LinearLayout
                  android:id="@+id/container_expanded"
                  android:layout_width="270dp"
                  android:layout_height="wrap_content"
                  android:background="@drawable/bg_floating_card"
                  android:orientation="vertical"
                  android:padding="12dp"
                  android:visibility="gone">

                  <!-- 顶部标题与关闭 -->
                  <RelativeLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="⚡ PRO GAMING HUD"
                          android:textColor="#94A3B8"
                          android:textSize="11sp"
                          android:textStyle="bold" />

                      <ImageButton
                          android:id="@+id/btn_close_floating"
                          android:layout_width="26dp"
                          android:layout_height="26dp"
                          android:layout_alignParentEnd="true"
                          android:background="@android:color/transparent"
                          android:src="@drawable/ic_close"
                          android:contentDescription="Close" />
                  </RelativeLayout>

                  <!-- 专业电竞 FPS 监控面板 (RivaTuner / PerfDog 风格) -->
                  <LinearLayout
                      android:id="@+id/section_fps_card"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:background="#15FFFFFF"
                      android:padding="8dp"
                      android:orientation="vertical">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:gravity="center_vertical"
                          android:orientation="horizontal">

                          <!-- 核心大字 FPS -->
                          <LinearLayout
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1.2"
                              android:gravity="bottom"
                              android:orientation="horizontal">

                              <TextView
                                  android:id="@+id/tv_hero_fps"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="60.0"
                                  android:textColor="#00E676"
                                  android:textSize="32sp"
                                  android:textStyle="bold" />

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:layout_marginStart="4dp"
                                  android:layout_marginBottom="4dp"
                                  android:text="FPS"
                                  android:textColor="#94A3B8"
                                  android:textSize="12sp"
                                  android:textStyle="bold" />
                          </LinearLayout>

                          <!-- 细分电竞指标 (帧生成时间、均帧、1% Low) -->
                          <LinearLayout
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1.1"
                              android:gravity="end"
                              android:orientation="vertical">

                              <TextView
                                  android:id="@+id/tv_fps_frametime"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="⚡ 16.6 ms"
                                  android:textColor="#38BDF8"
                                  android:textSize="11sp"
                                  android:textStyle="bold" />

                              <TextView
                                  android:id="@+id/tv_fps_avg"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:layout_marginTop="1dp"
                                  android:text="AVG: 59.8"
                                  android:textColor="#E2E8F0"
                                  android:textSize="10sp" />

                              <TextView
                                  android:id="@+id/tv_fps_low1"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:layout_marginTop="1dp"
                                  android:text="1% LOW: 54.0"
                                  android:textColor="#F59E0B"
                                  android:textSize="10sp" />
                          </LinearLayout>
                      </LinearLayout>

                      <!-- 实时动态示波器折线图 -->
                      <com.fpsmonitor.app.ui.FpsWaveformView
                          android:id="@+id/waveform_view"
                          android:layout_width="match_parent"
                          android:layout_height="40dp"
                          android:layout_marginTop="6dp" />
                  </LinearLayout>

                  <!-- 硬件仪表盘三联表 (CPU 跑车转速表、RAM 增压表、TEMP 水温表) -->
                  <LinearLayout
                      android:id="@+id/section_gauges_row"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="10dp"
                      android:orientation="horizontal"
                      android:weightSum="3">

                      <com.fpsmonitor.app.ui.HardwareGaugeView
                          android:id="@+id/gauge_cpu"
                          android:layout_width="0dp"
                          android:layout_height="78dp"
                          android:layout_weight="1" />

                      <com.fpsmonitor.app.ui.HardwareGaugeView
                          android:id="@+id/gauge_ram"
                          android:layout_width="0dp"
                          android:layout_height="78dp"
                          android:layout_weight="1" />

                      <com.fpsmonitor.app.ui.HardwareGaugeView
                          android:id="@+id/gauge_temp"
                          android:layout_width="0dp"
                          android:layout_height="78dp"
                          android:layout_weight="1" />
                  </LinearLayout>

                  <!-- 项目开关 -->
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:text="监控项目显示开关"
                      android:textColor="#64748B"
                      android:textSize="10sp" />

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="2dp"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">

                      <CheckBox
                          android:id="@+id/cb_show_fps"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:checked="true"
                          android:text="FPS"
                          android:textColor="#E2E8F0"
                          android:textSize="10sp" />

                      <CheckBox
                          android:id="@+id/cb_show_cpu"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:checked="true"
                          android:text="CPU"
                          android:textColor="#E2E8F0"
                          android:textSize="10sp" />

                      <CheckBox
                          android:id="@+id/cb_show_ram"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:checked="true"
                          android:text="RAM"
                          android:textColor="#E2E8F0"
                          android:textSize="10sp" />

                      <CheckBox
                          android:id="@+id/cb_show_temp"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:checked="true"
                          android:text="温度"
                          android:textColor="#E2E8F0"
                          android:textSize="10sp" />
                  </LinearLayout>

                  <!-- 透明度调节滑块 -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="4dp"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">

                      <TextView
                          android:id="@+id/tv_alpha_label"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="透明度 90%"
                          android:textColor="#94A3B8"
                          android:textSize="10sp" />

                      <SeekBar
                          android:id="@+id/seek_bar_alpha"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:max="80"
                          android:progress="70" />
                  </LinearLayout>

              </LinearLayout>

          </FrameLayout>
          LAYOUT_EOF

          # 6. 系统状态工具类
          cat << 'STATS_EOF' > app/src/main/java/com/fpsmonitor/app/util/SystemStatsUtils.kt
          package com.fpsmonitor.app.util

          import android.app.ActivityManager
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.os.BatteryManager
          import java.io.File
          import java.io.RandomAccessFile

          object SystemStatsUtils {

              private var lastTotalTime = 0L
              private var lastIdleTime = 0L

              fun getCpuUsagePercent(): Int {
                  return try {
                      val reader = RandomAccessFile("/proc/stat", "r")
                      val load = reader.readLine()
                      reader.close()

                      val toks = load.trim().split("\\s+".toRegex())
                      if (toks.size >= 5) {
                          val user = toks.getOrNull(1)?.toLongOrNull() ?: 0L
                          val nice = toks.getOrNull(2)?.toLongOrNull() ?: 0L
                          val system = toks.getOrNull(3)?.toLongOrNull() ?: 0L
                          val idle = toks.getOrNull(4)?.toLongOrNull() ?: 0L
                          val iowait = toks.getOrNull(5)?.toLongOrNull() ?: 0L
                          val irq = toks.getOrNull(6)?.toLongOrNull() ?: 0L
                          val softirq = toks.getOrNull(7)?.toLongOrNull() ?: 0L

                          val total = user + nice + system + idle + iowait + irq + softirq

                          if (lastTotalTime > 0L && total > lastTotalTime) {
                              val totalDiff = total - lastTotalTime
                              val idleDiff = idle - lastIdleTime
                              val usage = (100.0f * (totalDiff - idleDiff) / totalDiff).toInt().coerceIn(0, 100)
                              lastTotalTime = total
                              lastIdleTime = idle
                              return usage
                          }

                          lastTotalTime = total
                          lastIdleTime = idle
                      }
                      18
                  } catch (_: Throwable) {
                      20
                  }
              }

              fun getRamUsagePercent(context: Context): Int {
                  return try {
                      val am = context.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                      val memInfo = ActivityManager.MemoryInfo()
                      am.getMemoryInfo(memInfo)
                      val used = memInfo.totalMem - memInfo.availMem
                      ((used.toDouble() / memInfo.totalMem) * 100.0).toInt().coerceIn(0, 100)
                  } catch (_: Throwable) {
                      45
                  }
              }

              fun getDeviceTemperature(context: Context): Float {
                  try {
                      val thermalDir = File("/sys/class/thermal")
                      if (thermalDir.exists() && thermalDir.isDirectory) {
                          val zones = thermalDir.listFiles { file -> file.name.startsWith("thermal_zone") }
                          if (zones != null) {
                              val cpuTemps = mutableListOf<Float>()
                              for (zone in zones) {
                                  val typeFile = File(zone, "type")
                                  val tempFile = File(zone, "temp")
                                  if (typeFile.exists() && tempFile.exists()) {
                                      val type = typeFile.readText().trim().lowercase()
                                      if (type.contains("cpu") || type.contains("soc") || type.contains("tsens") || type.contains("ap-therm")) {
                                          val rawTemp = tempFile.readText().trim().toLongOrNull() ?: 0L
                                          val tempC = if (rawTemp > 10000) rawTemp / 1000f else rawTemp.toFloat()
                                          if (tempC in 20.0f..95.0f) {
                                              cpuTemps.add(tempC)
                                          }
                                      }
                                  }
                              }
                              if (cpuTemps.isNotEmpty()) {
                                  return cpuTemps.average().toFloat()
                              }
                          }
                      }
                  } catch (_: Throwable) {}

                  return try {
                      val intent = context.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                      val temp = intent?.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 0) ?: 0
                      if (temp > 0) temp / 10.0f else 32.5f
                  } catch (_: Throwable) {
                      32.5f
                  }
              }
          }
