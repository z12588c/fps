              private fun setupTouchDrag() {
                  val dragListener = View.OnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              initialX = params.x
                              initialY = params.y
                              initialTouchX = event.rawX
                              initialTouchY = event.rawY
                              isClickEvent = true
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (event.rawX - initialTouchX).toInt()
                              val dy = (event.rawY - initialTouchY).toInt()
                              if (abs(dx) > 10 || abs(dy) > 10) {
                                  isClickEvent = false
                              }
                              params.x = initialX + dx
                              params.y = initialY + dy
                              updateWindowLayout()
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (isClickEvent) {
                                  toggleExpandedState()
                              }
                              true
                          }
                          else -> false
                      }
                  }

                  miniContainer.setOnTouchListener(dragListener)
                  expandedContainer.setOnTouchListener(dragListener)
              }

              fun updateMetrics(data: FpsData) {
                  mainHandler.post {
                      val fps = if (data.currentFps > 0.0) data.currentFps else (if (data.avgFps > 0) data.avgFps else 60.0)

                      val now = System.currentTimeMillis()
                      if (now - lastStatsUpdateMs > 1000) {
                          cachedCpu = SystemStatsUtils.getCpuUsagePercent()
                          cachedRam = SystemStatsUtils.getRamUsagePercent(context)
                          cachedTemp = SystemStatsUtils.getDeviceTemperature(context)
                          lastStatsUpdateMs = now
                      }

                      val fpsInt = fps.toInt()
                      val tempStr = String.format(Locale.US, "%.1f°C", cachedTemp)

                      // 1. 迷你胶囊文本
                      tvMiniFps.text = "$fpsInt FPS"
                      tvMiniCpu.text = "CPU $cachedCpu%"
                      tvMiniRam.text = "RAM $cachedRam%"
                      tvMiniTemp.text = tempStr

                      val fpsColor = when {
                          fps >= 55.0 -> Color.parseColor("#00E676")
                          fps >= 40.0 -> Color.parseColor("#FFD600")
                          else -> Color.parseColor("#FF1744")
                      }
                      tvMiniFps.setTextColor(fpsColor)

                      // 2. 展开电竞面板更新
                      if (isExpanded) {
                          tvHeroFps.text = String.format(Locale.US, "%.1f", fps)
                          tvHeroFps.setTextColor(fpsColor)

                          val frameTimeVal = if (data.frameTimeMs > 0) data.frameTimeMs else (1000.0 / fps)
                          tvFpsFrametime.text = String.format(Locale.US, "⚡ %.1f ms", frameTimeVal)

                          val avgVal = if (data.avgFps > 0) data.avgFps else fps
                          val lowVal = if (data.low1PercentFps > 0) data.low1PercentFps else (fps * 0.90)
                          tvFpsAvg.text = String.format(Locale.US, "AVG: %.1f", avgVal)
                          tvFpsLow1.text = String.format(Locale.US, "1%% LOW: %.1f", lowVal)

                          // 实时波形流动
                          waveformView.addFpsPoint(fps.toFloat())

                          // 更新硬件跑车仪表盘 (CPU, RAM, TEMP)
                          gaugeCpu.setValue(cachedCpu.toFloat())
                          gaugeRam.setValue(cachedRam.toFloat())
                          gaugeTemp.setValue(cachedTemp)
                      }
                  }
              }

              fun attachToWindow() {
                  mainHandler.post {
                      try {
                          if (rootView.parent == null) {
                              windowManager.addView(rootView, params)
                          }
                      } catch (e: Throwable) {
                          Log.e("FloatingFpsView", "Error adding floating window", e)
                          Toast.makeText(context, "悬浮窗挂载异常: ${e.message}", Toast.LENGTH_LONG).show()
                      }
                  }
              }

              fun detachFromWindow() {
                  mainHandler.post {
                      try {
                          if (rootView.parent != null) {
                              windowManager.removeView(rootView)
                          }
                      } catch (e: Throwable) {
                          Log.e("FloatingFpsView", "Error removing floating window", e)
                      }
                  }
              }

              private fun updateWindowLayout() {
                  mainHandler.post {
                      try {
                          if (rootView.parent != null) {
                              windowManager.updateViewLayout(rootView, params)
                          }
                      } catch (_: Throwable) {}
                  }
              }
          }
