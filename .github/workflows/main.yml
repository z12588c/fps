name: Build Android APK
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build Real-Time FPS APK
        run: |
          [ -d "AndroidFpsMonitor" ] && cp -r AndroidFpsMonitor/. .
          
          # 1. 注入 AndroidX 配置
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 2. 清洗 Manifest 并集成 ShizukuProvider 通信通道
          cat << 'MANIFEST_EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS"
                  tools:ignore="ProtectedPermissions" />

              <application
                  android:allowBackup="true"
                  android:dataExtractionRules="@xml/data_extraction_rules"
                  android:fullBackupContent="@xml/backup_rules"
                  android:icon="@drawable/ic_fps"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AndroidFpsMonitor">

                  <activity
                      android:name=".ui.MainActivity"
                      android:exported="true"
                      android:theme="@style/Theme.AndroidFpsMonitor">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".service.FloatingFpsService"
                      android:enabled="true"
                      android:exported="false" />

                  <!-- 显式注册 Shizuku 通信 Provider -->
                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:multiprocess="false"
                      android:enabled="true"
                      android:exported="true"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL"
                      tools:replace="android:authorities" />

              </application>

          </manifest>
          MANIFEST_EOF

          # 3. 布局文件
          cat << 'LAYOUT_EOF' > app/src/main/res/layout/view_floating_fps.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="wrap_content"
              android:layout_height="wrap_content">

              <LinearLayout
                  android:id="@+id/container_mini"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:background="@drawable/bg_floating_mini"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  android:paddingStart="14dp"
                  android:paddingEnd="14dp"
                  android:paddingTop="6dp"
                  android:paddingBottom="6dp"
                  android:visibility="visible">

                  <TextView
                      android:id="@+id/tv_mini_fps"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="0.0 FPS"
                      android:textColor="#00E676"
                      android:textSize="15sp"
                      android:textStyle="bold" />

                  <View
                      android:layout_width="1.5dp"
                      android:layout_height="12dp"
                      android:layout_marginStart="8dp"
                      android:layout_marginEnd="8dp"
                      android:background="#50FFFFFF" />

                  <TextView
                      android:id="@+id/tv_mini_frametime"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="0.0 ms"
                      android:textColor="#FFFFFF"
                      android:textSize="12sp"
                      android:textStyle="bold" />
              </LinearLayout>

              <LinearLayout
                  android:id="@+id/container_expanded"
                  android:layout_width="220dp"
                  android:layout_height="wrap_content"
                  android:background="@drawable/bg_floating_card"
                  android:orientation="vertical"
                  android:padding="12dp"
                  android:visibility="gone">

                  <RelativeLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content">

                      <TextView
                          android:id="@+id/tv_full_fps"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="0.0 FPS"
                          android:textColor="#00E676"
                          android:textSize="22sp"
                          android:textStyle="bold" />

                      <ImageButton
                          android:id="@+id/btn_close_floating"
                          android:layout_width="28dp"
                          android:layout_height="28dp"
                          android:layout_alignParentEnd="true"
                          android:background="@android:color/transparent"
                          android:src="@drawable/ic_close"
                          android:contentDescription="Close" />
                  </RelativeLayout>

                  <TextView
                      android:id="@+id/tv_surface_name"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="2dp"
                      android:ellipsize="middle"
                      android:singleLine="true"
                      android:text="Waiting for game..."
                      android:textColor="#94A3B8"
                      android:textSize="11sp" />

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:orientation="horizontal"
                      android:weightSum="3">

                      <LinearLayout
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:orientation="vertical">
                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="Avg FPS"
                              android:textColor="#94A3B8"
                              android:textSize="10sp" />
                          <TextView
                              android:id="@+id/tv_avg_fps"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="0.0"
                              android:textColor="#F0F4F8"
                              android:textSize="13sp"
                              android:textStyle="bold" />
                      </LinearLayout>

                      <LinearLayout
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:orientation="vertical">
                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="1% Low"
                              android:textColor="#94A3B8"
                              android:textSize="10sp" />
                          <TextView
                              android:id="@+id/tv_low1_fps"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="0.0"
                              android:textColor="#FFD600"
                              android:textSize="13sp"
                              android:textStyle="bold" />
                      </LinearLayout>

                      <LinearLayout
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:orientation="vertical">
                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="卡顿率"
                              android:textColor="#94A3B8"
                              android:textSize="10sp" />
                          <TextView
                              android:id="@+id/tv_stutter_rate"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="0.0%"
                              android:textColor="#00E676"
                              android:textSize="13sp"
                              android:textStyle="bold" />
                      </LinearLayout>
                  </LinearLayout>

                  <com.fpsmonitor.app.ui.FpsWaveformView
                      android:id="@+id/waveform_view"
                      android:layout_width="match_parent"
                      android:layout_height="45dp"
                      android:layout_marginTop="8dp" />

              </LinearLayout>

          </FrameLayout>
          LAYOUT_EOF

          # 4. 修复 ShizukuUtils 兼容性
          cat << 'SHIZUKU_EOF' > app/src/main/java/com/fpsmonitor/app/util/ShizukuUtils.kt
          package com.fpsmonitor.app.util

          import android.content.pm.PackageManager
          import rikka.shizuku.Shizuku
          import java.io.BufferedReader
          import java.io.InputStreamReader

          object ShizukuUtils {

              fun isShizukuAvailable(): Boolean {
                  return try {
                      Shizuku.pingBinder()
                  } catch (e: Throwable) {
                      false
                  }
              }

              fun hasShizukuPermission(): Boolean {
                  return if (isShizukuAvailable()) {
                      try {
                          Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED
                      } catch (e: Throwable) {
                          false
                      }
                  } else {
                      false
                  }
              }

              fun requestShizukuPermission(requestCode: Int = 1001) {
                  if (isShizukuAvailable() && !hasShizukuPermission()) {
                      try {
                          Shizuku.requestPermission(requestCode)
                      } catch (_: Throwable) {}
                  }
              }

              fun execShizukuCommand(command: String): ShellUtils.CommandResult {
                  return try {
                      val method = Shizuku::class.java.getDeclaredMethod(
                          "newProcess",
                          Array<String>::class.java,
                          Array<String>::class.java,
                          String::class.java
                      )
                      method.isAccessible = true
                      val process = method.invoke(null, arrayOf("sh", "-c", command), null, null) as Process

                      val reader = BufferedReader(InputStreamReader(process.inputStream))
                      val output = StringBuilder()
                      var line: String?
                      while (reader.readLine().also { line = it } != null) {
                          output.append(line).append("\n")
                      }
                      val exitCode = process.waitFor()
                      ShellUtils.CommandResult(exitCode, output.toString().trim(), "")
                  } catch (e: Throwable) {
                      ShellUtils.execCommand(command, useRoot = false)
                  }
              }
          }
          SHIZUKU_EOF

          # 5. 真实 SurfaceFlinger 采样引擎
          cat << 'ENGINE_EOF' > app/src/main/java/com/fpsmonitor/app/core/SurfaceFlingerMonitor.kt
          package com.fpsmonitor.app.core

          import android.util.Log
          import com.fpsmonitor.app.util.ShellUtils
          import com.fpsmonitor.app.util.ShizukuUtils
          import kotlinx.coroutines.*

          class SurfaceFlingerMonitor(
              private val useRoot: Boolean = false,
              private val useShizuku: Boolean = true,
              private val pollIntervalMs: Long = 150L
          ) : IFpsMonitor {

              private val fpsCalculator = FpsCalculator(windowSize = 240)
              private var job: Job? = null
              private val scope = CoroutineScope(Dispatchers.Default + SupervisorJob())
              private var lastActualPresentTimeNs = 0L
              private var activeSurfaceName = ""
              override var isRunning: Boolean = false
                  private set

              override fun start(onFpsUpdate: (FpsData) -> Unit) {
                  if (isRunning) return
                  isRunning = true
                  fpsCalculator.reset()
                  lastActualPresentTimeNs = 0L

                  job = scope.launch {
                      while (isActive && isRunning) {
                          try {
                              val surface = detectActiveGameSurface()
                              activeSurfaceName = surface

                              val cmd = if (surface.isNotEmpty()) {
                                  "dumpsys SurfaceFlinger --latency \"$surface\""
                              } else {
                                  "dumpsys SurfaceFlinger --latency"
                              }

                              val res = execShell(cmd)
                              if (res.isSuccess && res.stdout.isNotEmpty()) {
                                  parseLatencyData(res.stdout)
                              }

                              val data = fpsCalculator.calculate(surfaceName = if (surface.isNotEmpty()) surface else "Primary Screen")
                              withContext(Dispatchers.Main) {
                                  onFpsUpdate(data)
                              }
                          } catch (e: Exception) {
                              Log.e("SurfaceFlingerMonitor", "Latency query error", e)
                          }
                          delay(pollIntervalMs)
                      }
                  }
              }

              override fun stop() {
                  isRunning = false
                  job?.cancel()
                  job = null
              }

              private fun detectActiveGameSurface(): String {
                  val listRes = execShell("dumpsys SurfaceFlinger --list")
                  if (listRes.isSuccess && listRes.stdout.isNotEmpty()) {
                      val lines = listRes.stdout.lines()
                      for (line in lines) {
                          val trimmed = line.trim()
                          if (trimmed.startsWith("SurfaceView[") || (trimmed.contains("MainActivity") && !trimmed.contains("fpsmonitor"))) {
                              return trimmed
                          }
                      }
                  }
                  return ""
              }

              private fun parseLatencyData(raw: String) {
                  val lines = raw.lines().filter { it.isNotBlank() }
                  if (lines.size < 2) return

                  var prevTime = lastActualPresentTimeNs

                  for (i in 1 until lines.size) {
                      val tokens = lines[i].trim().split("\\s+".toRegex())
                      if (tokens.size < 3) continue

                      val actualTime = tokens.toLongOrNull() ?: 0L
                      if (actualTime <= 0L || actualTime == Long.MAX_VALUE || actualTime == 0x7fffffffffffffffL) {
                          continue
                      }

                      if (actualTime > prevTime) {
                          if (prevTime > 0L) {
                              val deltaNs = actualTime - prevTime
                              val deltaMs = deltaNs / 1_000_000.0f
                              if (deltaMs in 0.5f..500.0f) {
                                  fpsCalculator.recordFrame(deltaMs)
                              }
                          }
                          prevTime = actualTime
                      }
                  }

                  if (prevTime > lastActualPresentTimeNs) {
                      lastActualPresentTimeNs = prevTime
                  }
              }

              private fun execShell(command: String): ShellUtils.CommandResult {
                  return when {
                      ShizukuUtils.isShizukuAvailable() -> ShizukuUtils.execShizukuCommand(command)
                      useRoot -> ShellUtils.execCommand(command, useRoot = true)
                      else -> ShellUtils.execCommand(command, useRoot = false)
                  }
              }
          }
          ENGINE_EOF

          # 6. 修复 FloatingFpsView 绝对坐标拖拽与真实帧率展示
          cat << 'VIEW_EOF' > app/src/main/java/com/fpsmonitor/app/ui/FloatingFpsView.kt
          package com.fpsmonitor.app.ui

          import android.annotation.SuppressLint
          import android.content.Context
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.util.Log
          import android.view.*
          import android.widget.ImageButton
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import com.fpsmonitor.app.R
          import com.fpsmonitor.app.core.FpsData
          import java.util.Locale
          import kotlin.math.abs

          @SuppressLint("ClickableViewAccessibility")
          class FloatingFpsView(
              private val context: Context,
              private val onCloseRequested: () -> Unit
          ) {
              private val windowContext: Context = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                  val displayManager = context.getSystemService(Context.DISPLAY_SERVICE) as DisplayManager
                  val defaultDisplay = displayManager.getDisplay(Display.DEFAULT_DISPLAY)
                  context.createWindowContext(defaultDisplay, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY, null)
              } else {
                  context
              }

              private val windowManager: WindowManager = windowContext.getSystemService(Context.WINDOW_SERVICE) as WindowManager
              private val rootView: View
              private val params: WindowManager.LayoutParams

              private val tvMiniFps: TextView
              private val tvMiniFrameTime: TextView
              private val miniContainer: LinearLayout
              private val expandedContainer: LinearLayout

              private val tvFullFps: TextView
              private val tvAvgFps: TextView
              private val tvLow1Percent: TextView
              private val tvStutterRate: TextView
              private val tvSurfaceName: TextView
              private val waveformView: FpsWaveformView
              private val btnClose: ImageButton

              private var isExpanded = false
              private var initialX = 0
              private var initialY = 0
              private var initialTouchX = 0f
              private var initialTouchY = 0f
              private var isClickEvent = true
              private val mainHandler = Handler(Looper.getMainLooper())

              init {
                  val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      layoutType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                              WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 350
                      y = 120
                  }

                  val themedContext = ContextThemeWrapper(windowContext, R.style.Theme_AndroidFpsMonitor)
                  rootView = LayoutInflater.from(themedContext).inflate(R.layout.view_floating_fps, null)

                  miniContainer = rootView.findViewById(R.id.container_mini)
                  expandedContainer = rootView.findViewById(R.id.container_expanded)
                  tvMiniFps = rootView.findViewById(R.id.tv_mini_fps)
                  tvMiniFrameTime = rootView.findViewById(R.id.tv_mini_frametime)

                  tvFullFps = rootView.findViewById(R.id.tv_full_fps)
                  tvAvgFps = rootView.findViewById(R.id.tv_avg_fps)
                  tvLow1Percent = rootView.findViewById(R.id.tv_low1_fps)
                  tvStutterRate = rootView.findViewById(R.id.tv_stutter_rate)
                  tvSurfaceName = rootView.findViewById(R.id.tv_surface_name)
                  waveformView = rootView.findViewById(R.id.waveform_view)
                  btnClose = rootView.findViewById(R.id.btn_close_floating)

                  setupTouchDrag()
                  setupListeners()
              }

              private fun setupListeners() {
                  btnClose.setOnClickListener { onCloseRequested() }
              }

              private fun toggleExpandedState() {
                  isExpanded = !isExpanded
                  if (isExpanded) {
                      miniContainer.visibility = View.GONE
                      expandedContainer.visibility = View.VISIBLE
                  } else {
                      miniContainer.visibility = View.VISIBLE
                      expandedContainer.visibility = View.GONE
                  }
                  updateWindowLayout()
              }

              private fun setupTouchDrag() {
                  val dragListener = View.OnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              initialX = params.x
                              initialY = params.y
                              initialTouchX = event.rawX
                              initialTouchY = event.rawY
                              isClickEvent = true
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (event.rawX - initialTouchX).toInt()
                              val dy = (event.rawY - initialTouchY).toInt()
                              if (abs(dx) > 10 || abs(dy) > 10) {
                                  isClickEvent = false
                              }
                              params.x = initialX + dx
                              params.y = initialY + dy
                              updateWindowLayout()
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (isClickEvent) {
                                  toggleExpandedState()
                              }
                              true
                          }
                          else -> false
                      }
                  }

                  miniContainer.setOnTouchListener(dragListener)
                  expandedContainer.setOnTouchListener(dragListener)
              }

              fun updateMetrics(data: FpsData) {
                  mainHandler.post {
                      val fps = data.currentFps
                      val ft = data.frameTimeMs

                      val fpsStr = if (fps > 0.0) String.format(Locale.US, "%.1f", fps) else "--"
                      val ftStr = if (ft > 0.0) String.format(Locale.US, "%.1f ms", ft) else "-- ms"

                      tvMiniFps.text = "$fpsStr FPS"
                      tvMiniFrameTime.text = ftStr

                      val fpsColor = when {
                          fps >= 58.0 -> Color.parseColor("#00E676")
                          fps >= 40.0 -> Color.parseColor("#FFD600")
                          fps > 0.0 -> Color.parseColor("#FF1744")
                          else -> Color.parseColor("#94A3B8")
                      }
                      tvMiniFps.setTextColor(fpsColor)
                      tvFullFps.setTextColor(fpsColor)

                      if (isExpanded) {
                          tvFullFps.text = "$fpsStr FPS"
                          tvAvgFps.text = if (data.avgFps > 0) String.format(Locale.US, "%.1f", data.avgFps) else "--"
                          tvLow1Percent.text = if (data.low1PercentFps > 0) String.format(Locale.US, "%.1f", data.low1PercentFps) else "--"
                          tvStutterRate.text = String.format(Locale.US, "%.1f%%", data.stutterRatePercent)
                          tvSurfaceName.text = if (data.targetSurface.isNotEmpty()) data.targetSurface else "Primary Screen"

                          if (data.historyFrameTimes.isNotEmpty()) {
                              waveformView.updateData(data.historyFrameTimes)
                          } else if (ft > 0.0) {
                              waveformView.addDataPoint(ft.toFloat())
                          }
                      }
                  }
              }

              fun attachToWindow() {
                  mainHandler.post {
                      try {
                          if (rootView.parent == null) {
                              windowManager.addView(rootView, params)
                          }
                      } catch (e: Throwable) {
                          Log.e("FloatingFpsView", "Error adding floating window", e)
                          Toast.makeText(context, "悬浮窗挂载异常: ${e.message}", Toast.LENGTH_LONG).show()
                      }
                  }
              }

              fun detachFromWindow() {
                  mainHandler.post {
                      try {
                          if (rootView.parent != null) {
                              windowManager.removeView(rootView)
                          }
                      } catch (e: Throwable) {
                          Log.e("FloatingFpsView", "Error removing floating window", e)
                      }
                  }
              }

              private fun updateWindowLayout() {
                  mainHandler.post {
                      try {
                          if (rootView.parent != null) {
                              windowManager.updateViewLayout(rootView, params)
                          }
                      } catch (_: Throwable) {}
                  }
              }
          }
          VIEW_EOF

          # 7. MainActivity 监听 Shizuku 自动绑定
          cat << 'MAIN_EOF' > app/src/main/java/com/fpsmonitor/app/ui/MainActivity.kt
          package com.fpsmonitor.app.ui

          import android.Manifest
          import android.animation.ValueAnimator
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.view.animation.LinearInterpolator
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import com.fpsmonitor.app.R
          import com.fpsmonitor.app.core.ChoreographerMonitor
          import com.fpsmonitor.app.core.FpsData
          import com.fpsmonitor.app.databinding.ActivityMainBinding
          import com.fpsmonitor.app.service.FloatingFpsService
          import com.fpsmonitor.app.util.PermissionUtils
          import com.fpsmonitor.app.util.ShellUtils
          import com.fpsmonitor.app.util.ShizukuUtils
          import rikka.shizuku.Shizuku
          import java.util.Locale

          class MainActivity : AppCompatActivity() {

              private lateinit var binding: ActivityMainBinding
              private var inAppMonitor: ChoreographerMonitor? = null
              private var stressAnimator: ValueAnimator? = null

              private val binderListener = Shizuku.OnBinderReceivedListener {
                  runOnUiThread { refreshPermissionStatus() }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  binding = ActivityMainBinding.inflate(layoutInflater)
                  setContentView(binding.root)

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1002)
                      }
                  }

                  try {
                      Shizuku.addBinderReceivedListenerSticky(binderListener)
                  } catch (_: Throwable) {}

                  setupEnvironmentCheck()
                  setupListeners()
                  setupInAppPreview()
              }

              override fun onResume() {
                  super.onResume()
                  refreshPermissionStatus()
              }

              private fun setupEnvironmentCheck() {
                  refreshPermissionStatus()

                  binding.btnGrantOverlay.setOnClickListener {
                      PermissionUtils.requestOverlayPermission(this)
                  }

                  binding.btnRequestShizuku.setOnClickListener {
                      if (ShizukuUtils.isShizukuAvailable()) {
                          ShizukuUtils.requestShizukuPermission()
                      } else {
                          Toast.makeText(this, "正在连接 Shizuku 服务...", Toast.LENGTH_SHORT).show()
                          refreshPermissionStatus()
                      }
                  }
              }

              private fun refreshPermissionStatus() {
                  val hasOverlay = PermissionUtils.canDrawOverlays(this)
                  binding.tvOverlayStatus.text = if (hasOverlay) "悬浮窗权限: 已授权" else "悬浮窗权限: 未授权"
                  binding.tvOverlayStatus.setTextColor(ContextCompat.getColor(this, if (hasOverlay) R.color.green_accent else R.color.red_accent))
                  binding.btnGrantOverlay.isEnabled = !hasOverlay

                  val isRoot = ShellUtils.isRootAvailable()
                  binding.tvRootStatus.text = if (isRoot) "Root 权限: 已获取" else "Root 权限: 未获取"
                  binding.tvRootStatus.setTextColor(ContextCompat.getColor(this, if (isRoot) R.color.green_accent else R.color.text_secondary))

                  val hasShizuku = ShizukuUtils.hasShizukuPermission() || ShizukuUtils.isShizukuAvailable()
                  binding.tvShizukuStatus.text = if (hasShizuku) "Shizuku 权限: 已授权" else "Shizuku 权限: 待授权"
                  binding.tvShizukuStatus.setTextColor(ContextCompat.getColor(this, if (hasShizuku) R.color.green_accent else R.color.text_secondary))
              }

              private fun setupListeners() {
                  binding.btnStartOverlay.setOnClickListener {
                      if (!PermissionUtils.canDrawOverlays(this)) {
                          Toast.makeText(this, "请先授予悬浮窗权限！", Toast.LENGTH_SHORT).show()
                          PermissionUtils.requestOverlayPermission(this)
                          return@setOnClickListener
                      }

                      val mode = when (binding.rgEngineMode.checkedRadioButtonId) {
                          R.id.rb_surface_flinger -> "SURFACE_FLINGER"
                          R.id.rb_gfxinfo -> "GFXINFO"
                          else -> "CHOREOGRAPHER"
                      }

                      val useRoot = ShellUtils.isRootAvailable()
                      val useShizuku = ShizukuUtils.hasShizukuPermission() || ShizukuUtils.isShizukuAvailable()

                      FloatingFpsService.startService(
                          context = this,
                          mode = mode,
                          useRoot = useRoot,
                          useShizuku = useShizuku
                      )
                      Toast.makeText(this, "FPS 悬浮窗已启动", Toast.LENGTH_SHORT).show()
                  }

                  binding.btnStopOverlay.setOnClickListener {
                      FloatingFpsService.stopService(this)
                      Toast.makeText(this, "FPS 悬浮窗已关闭", Toast.LENGTH_SHORT).show()
                  }

                  binding.switchStressTest.setOnCheckedChangeListener { _, isChecked ->
                      if (isChecked) startStressTestAnimation() else stopStressTestAnimation()
                  }
              }

              private fun setupInAppPreview() {
                  inAppMonitor = ChoreographerMonitor()
                  inAppMonitor?.start { data: FpsData ->
                      binding.tvPreviewFps.text = String.format(Locale.US, "%.1f", data.currentFps)
                      binding.tvPreviewFrametime.text = String.format(Locale.US, "%.1f ms", data.frameTimeMs)
                      binding.tvPreviewAvg.text = String.format(Locale.US, "Avg: %.1f", data.avgFps)
                      binding.tvPreviewLow1.text = String.format(Locale.US, "1%% Low: %.1f", data.low1PercentFps)
                      binding.previewWaveform.addDataPoint(data.frameTimeMs.toFloat())
                  }
              }

              private fun startStressTestAnimation() {
                  stressAnimator = ValueAnimator.ofFloat(0f, 360f).apply {
                      duration = 1500
                      repeatCount = ValueAnimator.INFINITE
                      interpolator = LinearInterpolator()
                      addUpdateListener { anim ->
                          binding.ivStressIndicator.rotation = anim.animatedValue as Float
                          if (binding.switchHeavyLoad.isChecked) {
                              var dummy = 0.0
                              for (i in 0..150000) {
                                  dummy += Math.sin(i.toDouble()) * Math.cos(i.toDouble())
                              }
                          }
                      }
                      start()
                  }
              }

              private fun stopStressTestAnimation() {
                  stressAnimator?.cancel()
                  stressAnimator = null
                  binding.ivStressIndicator.rotation = 0f
              }

              override fun onDestroy() {
                  super.onDestroy()
                  try {
                      Shizuku.removeBinderReceivedListener(binderListener)
                  } catch (_: Throwable) {}
                  inAppMonitor?.stop()
                  stopStressTestAnimation()
              }
          }
          MAIN_EOF

          # 8. 构建配置
          cat << 'BUILD_EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          BUILD_EOF

          gradle wrapper --gradle-version 8.2
          ./gradlew assembleDebug --stacktrace -x test -x lint
      - uses: actions/upload-artifact@v4
        with:
          name: AndroidFpsMonitor-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
