          # 8. 真实游戏帧率采集引擎 (精准追踪 SurfaceView 实际提交帧，解决 120Hz 屏幕下 60 帧游戏被误判为 120 帧的问题)
          cat << 'ENGINE_EOF' > app/src/main/java/com/fpsmonitor/app/core/SurfaceFlingerMonitor.kt
          package com.fpsmonitor.app.core

          import com.fpsmonitor.app.util.ShellUtils
          import com.fpsmonitor.app.util.ShizukuUtils
          import kotlinx.coroutines.*

          class SurfaceFlingerMonitor(
              private val useRoot: Boolean = false,
              private val useShizuku: Boolean = true
          ) : IFpsMonitor {

              private val fpsCalculator = FpsCalculator(windowSize = 120)
              private var job: Job? = null
              private val scope = CoroutineScope(Dispatchers.IO + SupervisorJob())
              private var lastActualPresentTimeNs = 0L
              private var cachedLayerName: String? = null
              private var lastLayerCheckMs = 0L

              override var isRunning: Boolean = false
                  private set

              override fun start(onFpsUpdate: (FpsData) -> Unit) {
                  if (isRunning) return
                  isRunning = true
                  fpsCalculator.reset()
                  lastActualPresentTimeNs = 0L
                  cachedLayerName = null
                  lastLayerCheckMs = 0L

                  job = scope.launch {
                      while (isActive && isRunning) {
                          try {
                              val now = System.currentTimeMillis()
                              if (cachedLayerName == null || now - lastLayerCheckMs > 2000L) {
                                  cachedLayerName = findActiveGameLayer()
                                  lastLayerCheckMs = now
                              }

                              val cmd = if (!cachedLayerName.isNullOrEmpty()) {
                                  "dumpsys SurfaceFlinger --latency \"$cachedLayerName\""
                              } else {
                                  "dumpsys SurfaceFlinger --latency"
                              }

                              val res = execShell(cmd)
                              if (res.isSuccess && res.stdout.isNotBlank()) {
                                  val newFrames = parseLatencyData(res.stdout)
                                  if (newFrames > 0) {
                                      val data = fpsCalculator.calculate(surfaceName = cachedLayerName ?: "Display")
                                      withContext(Dispatchers.Main) {
                                          onFpsUpdate(data)
                                      }
                                  }
                              }
                          } catch (_: Throwable) {}
                          delay(200L)
                      }
                  }
              }

              override fun stop() {
                  isRunning = false
                  job?.cancel()
                  job = null
              }

              private fun findActiveGameLayer(): String? {
                  try {
                      val listRes = execShell("dumpsys SurfaceFlinger --list")
                      if (listRes.isSuccess && listRes.stdout.isNotBlank()) {
                          val lines = listRes.stdout.lines().map { it.trim() }.filter { it.isNotEmpty() }
                          
                          // 1. 优先寻找真实游戏渲染的 SurfaceView 图层
                          val surfaceViewLayer = lines.firstOrNull { 
                              it.contains("SurfaceView", ignoreCase = true) && !it.contains("com.fpsmonitor.app", ignoreCase = true) 
                          }
                          if (surfaceViewLayer != null) return surfaceViewLayer

                          // 2. 寻找前台活跃的主 Activity 图层 (排除系统 UI 与悬浮窗自身)
                          val appLayer = lines.firstOrNull { 
                              !it.contains("com.fpsmonitor.app", ignoreCase = true) &&
                              !it.contains("StatusBar", ignoreCase = true) &&
                              !it.contains("NavigationBar", ignoreCase = true) &&
                              !it.contains("Wallpaper", ignoreCase = true) &&
                              !it.contains("NotificationShade", ignoreCase = true) &&
                              !it.contains("InputMethod", ignoreCase = true) &&
                              it.contains("#0")
                          }
                          if (appLayer != null) return appLayer
                      }
                  } catch (_: Throwable) {}
                  return null
              }

              private fun parseLatencyData(raw: String): Int {
                  val lines = raw.lines().filter { it.isNotBlank() }
                  if (lines.size < 2) return 0

                  var framesParsed = 0
                  var prevTime = lastActualPresentTimeNs

                  for (i in 1 until lines.size) {
                      val line = lines.getOrNull(i) ?: continue
                      val tokens = line.trim().split("\\s+".toRegex())
                      if (tokens.size < 3) continue

                      val desiredTime = tokens.getOrNull(0)?.toLongOrNull() ?: 0L
                      val actualTime = tokens.getOrNull(1)?.toLongOrNull() ?: 0L
                      val readyTime = tokens.getOrNull(2)?.toLongOrNull() ?: 0L

                      val validTime = when {
                          actualTime in 1L..(Long.MAX_VALUE - 1000000L) -> actualTime
                          readyTime in 1L..(Long.MAX_VALUE - 1000000L) -> readyTime
                          desiredTime in 1L..(Long.MAX_VALUE - 1000000L) -> desiredTime
                          else -> 0L
                      }

                      if (validTime > 0L && validTime > prevTime) {
                          if (prevTime > 0L) {
                              val deltaNs = validTime - prevTime
                              val deltaMs = deltaNs / 1_000_000.0f
                              if (deltaMs in 1.0f..350.0f) {
                                  fpsCalculator.recordFrame(deltaMs)
                                  framesParsed++
                              }
                          }
                          prevTime = validTime
                      }
                  }

                  if (prevTime > lastActualPresentTimeNs) {
                      lastActualPresentTimeNs = prevTime
                  }
                  return framesParsed
              }

              private fun execShell(command: String): ShellUtils.CommandResult {
                  return when {
                      ShizukuUtils.isShizukuAvailable() -> ShizukuUtils.execShizukuCommand(command)
                      useRoot -> ShellUtils.execCommand(command, useRoot = true)
                      else -> ShellUtils.execCommand(command, useRoot = false)
                  }
              }
          }
          ENGINE_EOF

