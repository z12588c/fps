                          val alphaPercent = 20 + progress
                          val alphaVal = alphaPercent / 100.0f
                          tvAlphaLabel.text = "透明度 $alphaPercent%"
                          params.alpha = alphaVal
                          prefs.edit().putFloat("hud_alpha", alphaVal).apply()
                          updateWindowLayout()
                      }
                      override fun onStartTrackingTouch(seekBar: SeekBar?) {}
                      override fun onStopTrackingTouch(seekBar: SeekBar?) {}
                  })
              }

              private fun setupListeners() {
